function stripN(t){return t.replace(/[\u0591-\u05C7]/g,"");}
function fuzzy(a,b){const n=s=>s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");const x=n(a),y=n(b);if(x===y)return"exact";for(const alt of y.split("/").map(s=>n(s.trim())))if(x===alt)return"exact";const sk=["the","a","an","to","of","is","it","in","for","he","she","one","who"];const xc=x.split(" ").filter(w=>!sk.includes(w)).join(" "),yc=y.split(" ").filter(w=>!sk.includes(w)).join(" ");if(xc&&xc===yc)return"close";const yw=yc.split(" "),xw=xc.split(" ");if(yw.length>0&&yw.every(w=>xw.includes(w)))return"close";if(xw.length>0&&xw.every(w=>yw.includes(w))&&xw.length>=yw.length*0.5)return"close";if(lev(x,y)<=2&&y.length>3)return"close";return"wrong";}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}
function todayKey(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/864e5);}

// ═══════════════════════════════════════════════════
// PROGRESS ENGINE
// ═══════════════════════════════════════════════════
const TO=["gemara_structural","gemara_content","rashi","tosfos"];
function ws(p,t,i){return p.w?.[`${t}_${i}`]||{c:0,ic:0,sk:0,lv:0,ls:0,rc:0,ft:0};}
function upW(p,t,i,ok){const k=`${t}_${i}`,v=ws(p,t,i);return{...p,w:{...p.w,[k]:{c:v.c+(ok?1:0),ic:v.ic+(ok?0:1),sk:ok?v.sk+1:0,lv:ok?Math.min(v.lv+1,7):Math.max(v.lv-1,0),ls:Date.now(),rc:(v.rc||0)+(ok?1:0),ft:v.ft||Date.now()}}};}
function allSeen(p){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0)a.push({w,i,t,s});});});return a;}
// Smart timing: word is "due" when enough time passed based on level
function isDue(s){if(!s.ls)return false;const hrs=[0,1,4,12,24,72,168,336];const elapsed=(Date.now()-s.ls)/36e5;return elapsed>=(hrs[s.lv]||0);}
function dueWords(p){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0&&isDue(s))a.push({w,i,t,s});});});return a.sort((a,b)=>a.s.ls-b.s.ls);}
function nextWords(p,n){
  const due=dueWords(p).slice(0,Math.min(2,Math.floor(n*0.4)));
  const weak=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0&&s.lv<=1&&!due.some(d=>d.t===t&&d.i===i))weak.push({w,i,t,s});});});
  weak.sort(()=>Math.random()-0.5);const wp=[...due,...weak.slice(0,Math.min(1,n-due.length))];
  const rem=n-wp.length,fresh=[];
  for(const t of TO){if(fresh.length>=rem)break;(V[t]||[]).forEach((w,i)=>{if(fresh.length>=rem)return;const s=ws(p,t,i);if(s.ls===0)fresh.push({w,i,t,s});});}
  return[...wp,...fresh];
}
function nextTrack(p){for(const t of TO){if((V[t]||[]).some((_,i)=>ws(p,t,i).ls===0))return TRK[t].n;}return"All";}
function todayWords(p){const a=[],ct=new Date();ct.setHours(0,0,0,0);const c=ct.getTime();TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>=c)a.push({w,i,t,s});});});return a.sort(()=>Math.random()-0.5);}
function penWords(p,n){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.lv>=3)a.push({w,i,t,s});});});return a.sort((a,b)=>b.s.lv-a.s.lv).slice(0,n);}
function tots(p){let m=0,s=0,t=0;TO.forEach(tid=>{(V[tid]||[]).forEach((_,i)=>{t++;const sc=ws(p,tid,i);if(sc.ls>0)s++;if(sc.lv>=4)m++;});});return{m,s,t};}
function getWeakWords(p){const w=[];TO.forEach(t=>{(V[t]||[]).forEach((word,i)=>{const s=ws(p,t,i);if(s.ls>0&&(s.lv<=2||s.ic>s.c))w.push({hebrew:word.h,transliteration:word.t,english:word.e,cat:word.c,track:TRK[t].n,correct:s.c,incorrect:s.ic,level:s.lv});});});return w.sort((a,b)=>(a.level-b.level)||(b.incorrect-a.incorrect));}
function calcPen(c){const today=todayKey(),last=c.ld;if(!last)return null;const m=daysBetween(last,today)-1;if(m<=0)return null;if(m>=7)return{missed:m,review:25,decay:true};if(m>=2)return{missed:m,review:20,decay:false};return{missed:1,review:10,decay:false};}
function trackStats(p){return TO.map(t=>{const ws_=V[t].map((_,i)=>ws(p,t,i));return{id:t,...TRK[t],seen:ws_.filter(s=>s.ls>0).length,total:V[t].length,mastered:ws_.filter(s=>s.lv>=4).length,totalRc:ws_.reduce((a,s)=>a+(s.rc||0),0)};});}
function catStats(p){const cats={};TO.forEach(t=>{V[t].forEach((w,i)=>{const s=ws(p,t,i);if(!cats[w.c])cats[w.c]={n:w.c,total:0,seen:0,mastered:0,wrong:0};cats[w.c].total++;if(s.ls>0)cats[w.c].seen++;if(s.lv>=4)cats[w.c].mastered++;cats[w.c].wrong+=s.ic;});});return Object.values(cats).sort((a,b)=>b.total-a.total);}
function getBlanksForWords(p){return BLANKS.filter(b=>{const s=ws(p,...b.ak.split("_").reduce((a,x,i,arr)=>{if(i===arr.length-1)return[a[0],parseInt(x)];return[a[0]?a[0]+"_"+x:x,0];},[""]))?.ls>0;}).sort(()=>Math.random()-0.5);}
function blankWord(ak){const p=ak.split("_"),idx=parseInt(p.pop()),tr=p.join("_");return{w:V[tr]?.[idx],t:tr,i:idx};}

// APP
// ═══════════════════════════════════════════════════
const IP={w:{}},IC={ld:null,sk:0,bsk:0,days:{},pc:true,md:null};

function App(){
  const[sc,setSc]=useState("load");
  const[pr,setPr]=useState(IP);
  const[cal,setCal]=useState(IC);
  const[pen,setPen]=useState(null);
  const[ss,setSs]=useState(null);
  const[sr,setSr]=useState({nw:0,lv:0});
  const[lw,setLw]=useState(null);
  const[sl,setSl]=useState("");
  const[user,setUser]=useState(null);
  const[syncing,setSyncing]=useState(false);

  const syncToDb=useCallback(async(np,nc)=>{if(!sb||!user)return;setSyncing(true);try{await sb.from('progress').upsert({user_id:user.id,data:np,calendar:nc,updated_at:new Date().toISOString()},{onConflict:'user_id'});}catch(e){}setSyncing(false);},[user]);
  const loadFromDb=useCallback(async(uid)=>{if(!sb)return null;try{const{data}=await sb.from('progress').select('*').eq('user_id',uid).single();return data;}catch{return null;}},[]);

  useEffect(()=>{const init=async()=>{let u=null;if(sb){const{data:{session}}=await sb.auth.getSession();if(session)u=session.user;sb.auth.onAuthStateChange((_,s)=>{if(s?.user)setUser(s.user);else setUser(null);});}let p=LS.get("gv6_p")||IP,c=LS.get("gv6_c")||IC;if(u){setUser(u);const d=await loadFromDb(u.id);if(d){const dt=new Date(d.updated_at).getTime(),lt=c.ld?new Date(c.ld).getTime():0;if(dt>lt){p=d.data||p;c=d.calendar||c;}}}const pe=calcPen(c);if(pe?.decay){const nw={...p.w};Object.keys(nw).forEach(k=>{if(nw[k].lv>4)nw[k]={...nw[k],lv:nw[k].lv-1};});p={...p,w:nw};}if(pe&&c.ld&&c.ld!==todayKey()){setPen(pe);c={...c,pc:false};}if(c.ld===todayKey()){setPen(null);c={...c,pc:true};}if(c.md&&c.md!==todayKey())c={...c,md:null};setPr(p);setCal(c);LS.set("gv6_p",p);LS.set("gv6_c",c);setSc(sbOn&&!u?"auth":"home");};init();},[]);
  useEffect(()=>{if(sc!=="load"&&sc!=="auth"){LS.set("gv6_p",pr);LS.set("gv6_c",cal);syncToDb(pr,cal);}},[pr,cal]);

  const doAns=(t,i,ok)=>{const prev=ws(pr,t,i),np=upW(pr,t,i,ok),ns=ws(np,t,i);setPr(np);setSr(r=>({nw:r.nw+(prev.ls===0?1:0),lv:r.lv+(ns.lv>prev.lv?1:0)}));return np;};
  const rec=()=>{const today=todayKey(),el=Math.round((Date.now()-(ss||Date.now()))/1000);const prev=cal.days[today]||{ok:false,tm:0,nw:0,lv:0,ns:0};const isNew=!prev.ok;let sk=cal.sk;if(isNew){const y=new Date();y.setDate(y.getDate()-1);const yk=y.toISOString().slice(0,10);sk=(cal.ld===yk||cal.sk===0)?cal.sk+1:1;}const nc={...cal,ld:today,sk,bsk:Math.max(cal.bsk,sk),pc:true,days:{...cal.days,[today]:{ok:true,tm:prev.tm+el,nw:prev.nw+sr.nw,lv:prev.lv+sr.lv,ns:(prev.ns||0)+1}}};setCal(nc);setPen(null);return nc;};
  const go=(hasPen)=>{setSs(Date.now());setSr({nw:0,lv:0});if(hasPen){setLw(penWords(pr,pen?.review||10));setSl("pen");setSc("test");}else{const seen=allSeen(pr);if(seen.length>0&&cal.md!==todayKey()){setLw(seen.sort(()=>Math.random()-0.5));setSl("am");setSc("test");}else setSc("teach");}};

  if(sc==="auth")return<Auth onDone={async(u)=>{setUser(u);let p=LS.get("gv6_p")||IP,c=LS.get("gv6_c")||IC;const d=await loadFromDb(u.id);if(d){const dt=new Date(d.updated_at).getTime(),lt=c.ld?new Date(c.ld).getTime():0;if(dt>lt){p=d.data||p;c=d.calendar||c;}}const pe=calcPen(c);if(pe?.decay){const nw={...p.w};Object.keys(nw).forEach(k=>{if(nw[k].lv>4)nw[k]={...nw[k],lv:nw[k].lv-1};});p={...p,w:nw};}if(pe&&c.ld&&c.ld!==todayKey()){setPen(pe);c={...c,pc:false};}setPr(p);setCal(c);LS.set("gv6_p",p);LS.set("gv6_c",c);setSc("home");}} onSkip={()=>setSc("home")}/>;
  if(sc==="load")return<div style={{minHeight:"100vh",background:"#2C1E12",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{fontSize:"36px",fontFamily:"'Frank Ruhl Libre',serif",color:"#C4956A"}}>דַּף הַיּוֹמִי</div><div style={{fontSize:"14px",color:"#8B7355",marginTop:"8px",animation:"pulse 1.5s infinite"}}>Loading...</div></div></div>;

  // ─── HOME ───
  if(sc==="home"){
    const tot=tots(pr),today=todayKey(),td=cal.days[today];const hasPen=pen&&pen.missed>0&&!cal.pc;
    const done=td&&td.tm>=300&&(td.nw>=2||td.lv>=3);const tw=todayWords(pr),seenN=allSeen(pr).length;
    const morningDone=cal.md===today;const pct=tot.t>0?Math.round((tot.s/tot.t)*100):0;
    const weakW=getWeakWords(pr);const dueN=dueWords(pr).length;const totalRc=Object.values(pr.w||{}).reduce((a,v)=>a+(v.rc||0),0);

    return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",padding:`24px 20px calc(24px + ${SB})`,color:"#FAF3E8"}}>
      <div style={{position:"fixed",top:"8px",right:"12px",display:"flex",alignItems:"center",gap:"6px",zIndex:50}}>
        {syncing&&<div style={{width:"6px",height:"6px",borderRadius:"50%",background:"#C4956A",animation:"pulse 1s infinite"}}/>}
        {user&&<div style={{fontSize:"9px",color:"#8B735544"}}>{user.email?.split("@")[0]}</div>}
        {sbOn&&!user&&<button onClick={()=>setSc("auth")} style={{background:"none",color:"#C4956A44",fontSize:"10px",padding:"4px 8px",minHeight:"28px"}}>Sign in</button>}
      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:"100%",maxWidth:"360px"}}>
        {/* DAILY BRIEFING */}
        {seenN>=5&&<DailyBrief progress={pr} cal={cal}/>}

        <div style={{fontSize:"56px",marginBottom:"8px",lineHeight:1}}>{done?"✓":hasPen?"⚠️":td?"⏳":"📖"}</div>
        <div style={{fontSize:"24px",fontWeight:600,textAlign:"center",marginBottom:"6px",color:done?"#6B8E7B":hasPen?"#D4726A":"#FAF3E8"}}>{done?"Done for today":hasPen?`${pen.missed} day${pen.missed>1?"s":""} missed`:td?"Keep going":"Time to learn"}</div>
        <div style={{fontSize:"14px",color:"#8B7355",textAlign:"center",lineHeight:1.6,marginBottom:"16px",minHeight:"22px"}}>
          {done&&td&&<>{td.nw} new · {td.lv} leveled · {Math.floor(td.tm/60)}m</>}
          {hasPen&&<>Review {pen.review} words to clear{pen.decay?" · words decayed":""}</>}
          {!done&&!hasPen&&td&&<>{Math.floor(td.tm/60)}m so far · {td.nw} new</>}
          {!done&&!hasPen&&!td&&(seenN>0&&!morningDone?<>Morning review: {seenN} words</>:<>5 min minimum</>)}
        </div>

        {/* Chazara counter + due words */}
        <div style={{display:"flex",gap:"16px",marginBottom:"16px",fontSize:"13px",color:"#8B7355"}}>
          {cal.sk>0&&<span>{cal.sk>=7?"🔥":cal.sk>=3?"⚡":"📅"} {cal.sk} day streak</span>}
          {totalRc>0&&<span>📖 {totalRc} chazaros</span>}
          {dueN>0&&<span style={{color:"#C4956A"}}>⏰ {dueN} due</span>}
        </div>

        <div style={{width:"100%",maxWidth:"300px",marginBottom:"6px"}}><div style={{height:"5px",background:"rgba(255,255,255,0.08)",borderRadius:"3px",overflow:"hidden"}}><div style={{height:"100%",borderRadius:"3px",background:"linear-gradient(90deg,#6B8E7B,#C4956A)",width:`${pct}%`,transition:"width 0.5s"}}/></div></div>
        <div style={{fontSize:"12px",color:"#8B735566",marginBottom:"24px"}}>{tot.s}/{tot.t} words · {tot.m} mastered</div>

        <button onClick={()=>go(hasPen)} style={{...BTN,background:hasPen?"linear-gradient(135deg,#D4726A,#B85450)":done?"linear-gradient(135deg,#6B8E7B,#5A7D6A)":"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"340px",boxShadow:"0 4px 20px rgba(164,118,78,0.3)",animation:!done&&!td?"glow 2s infinite":"none"}}>{hasPen?"Clear Penalty":seenN>0&&!morningDone?"Morning Review":done?"Bonus Round":"Start Learning"}</button>

        {tw.length>0&&td?.ok&&!done&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setLw([...tw]);setSl("pm");setSc("test");}} style={{marginTop:"10px",padding:"14px",borderRadius:"12px",border:"1px solid rgba(196,149,106,0.15)",background:"transparent",maxWidth:"340px",width:"100%",fontSize:"15px",color:"#C4956A55",minHeight:"48px"}}>Review today's {tw.length} words</button>}

        {/* Laining mode — unlocks at 50+ mastered */}
        {tot.m>=50&&<button onClick={()=>setSc("laining")} style={{marginTop:"10px",padding:"14px",borderRadius:"12px",border:"1px solid rgba(107,142,123,0.2)",background:"transparent",maxWidth:"340px",width:"100%",fontSize:"15px",color:"#6B8E7B88",minHeight:"48px"}}>📜 Make a Laining (advanced)</button>}

        {/* Progress & AI Coach */}
        <div style={{display:"flex",gap:"8px",marginTop:"16px",width:"100%",maxWidth:"340px"}}>
          <button onClick={()=>setSc("progress")} style={{flex:1,padding:"12px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.12)",background:"transparent",color:"#8B735566",fontSize:"13px",minHeight:"44px"}}>📊 Progress</button>
          {weakW.length>=3&&<button onClick={()=>setSc("coach")} style={{flex:1,padding:"12px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.12)",background:"transparent",color:"#8B735566",fontSize:"13px",minHeight:"44px"}}>🎯 AI Coach</button>}
        </div>
      </div>
      <button onClick={()=>{if(confirm("Reset ALL progress?")){setPr(IP);setCal(IC);setPen(null);}}} style={{marginTop:"20px",background:"none",border:"none",color:"#8B735520",fontSize:"10px",minHeight:"30px"}}>Reset</button>
    </div>);
  }

  // ─── PROGRESS ───
  if(sc==="progress")return<ProgressView pr={pr} cal={cal} onBack={()=>setSc("home")}/>;

  // ─── AI COACH ───
  if(sc==="coach")return<CoachView pr={pr} cal={cal} onBack={()=>setSc("home")}/>;

  // ─── LAINING ───
  if(sc==="laining")return<Laining pr={pr} onBack={()=>setSc("home")}/>;

  // ─── TEACH ───
  if(sc==="teach"){
    const nw=nextWords(pr,5),tn=nextTrack(pr);
    if(nw.length===0)return<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px"}}><div style={{fontSize:"48px",marginBottom:"12px"}}>🎉</div><div style={{fontSize:"22px",color:"#3D2B1F",fontWeight:600}}>All {tots(pr).t} words learned!</div><button onClick={()=>setSc("home")} style={{...BTN,marginTop:"24px",background:"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"280px"}}>Home</button></div>;

        {tw.length>0&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setLw([...tw]);setSl("pm");setSc("test");}} style={{...BTN,background:"transparent",border:"1px solid rgba(196,149,106,0.2)",color:"#C4956A"}}>🌙 Review Today</button>}
        <button onClick={()=>setSc("home")} style={{...BTN,background:"transparent",border:"1px solid rgba(255,255,255,0.08)",color:"#8B7355"}}>Home</button>

// TEST
// ═══════════════════════════════════════════════════
function Test({words:wp,progress,onAns,onDone,showNek,rDir}){
  const wr=useRef(wp),words=wr.current;
  const[idx,setIdx]=useState(0),[inp,setInp]=useState(""),[fb,setFb]=useState(null),[dir,setDir]=useState("h2e");
  const[ai,setAi]=useState(""),[aiL,setAiL]=useState(false);const ref=useRef(null);
  useEffect(()=>{if(rDir&&!fb)setDir(Math.random()>0.4?"h2e":"e2h");},[idx]);
  useEffect(()=>{if(ref.current&&!fb)setTimeout(()=>ref.current?.focus(),150);},[idx,fb]);
  const cur=words[idx];if(!cur)return null;
  const sc=ws(progress,cur.t,cur.i),useN=showNek(sc.lv),heb=useN?cur.w.h:stripN(cur.w.h);
  const sub=()=>{if(!inp.trim())return;const ans=dir==="h2e"?cur.w.e:cur.w.t;const r=fuzzy(inp,ans);onAns(cur.t,cur.i,r!=="wrong");setFb(r);};
  const next=()=>{setInp("");setFb(null);setAi("");if(idx+1>=words.length)onDone();else setIdx(idx+1);};
  const onKey=e=>{if(e.key==="Enter"){if(fb)next();else sub();}};
  const hint=async()=>{setAiL(true);setAi("");const t=await askAI(`HINT for "${cur.w.h}" (${cur.w.t}). Answer is "${cur.w.e}" — do NOT reveal it. One sentence clue.`);setAi(t);setAiL(false);};
  const mnem=async()=>{setAiL(true);setAi("");const t=await askAI(`Memory trick for "${cur.w.h}" (${cur.w.t}) = "${cur.w.e}". Creative wordplay/sounds-like. 1-2 sentences.`);setAi(t);setAiL(false);};
  const fc={exact:{bg:"#D4EDDA",bd:"#6B8E7B",tx:"#2D5F3F",l:"✓ Correct!"},close:{bg:"#FFF3CD",bd:"#C4956A",tx:"#6B5A2E",l:"~ Close enough"},wrong:{bg:"#F8D7DA",bd:"#D4726A",tx:"#7A2B2B",l:"✗ Not quite"}};
  return(<div style={{display:"flex",flexDirection:"column",flex:1,padding:"0 20px"}}>
    <div style={{display:"flex",gap:"4px",justifyContent:"center",flexWrap:"wrap",maxWidth:"280px",margin:"0 auto 12px"}}>{words.map((_,i)=><div key={i} style={{width:"8px",height:"8px",borderRadius:"50%",background:i<idx?"#6B8E7B":i===idx?"#C4956A":"#D4B89644"}}/>)}</div>
    {!useN&&<div style={{fontSize:"11px",color:"#C4956A",letterSpacing:"1.5px",textTransform:"uppercase",textAlign:"center",marginBottom:"8px"}}>⚡ NO NEKUDOT</div>}
    <div style={{...CARD}}>{dir==="h2e"?<><div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"6px"}}>{cur.w.c} · {idx+1}/{words.length}</div><div style={{fontSize:"44px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.2}}>{heb}</div>{useN&&<div style={{fontSize:"14px",color:"#8B7355",marginTop:"6px",fontStyle:"italic"}}>{cur.w.t}</div>}</>:<><div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"6px"}}>TRANSLATE · {idx+1}/{words.length}</div><div style={{fontSize:"24px",color:"#3D2B1F"}}>{cur.w.e}</div></>}</div>
    {(ai||aiL)&&<div style={{maxWidth:"360px",margin:"12px auto",...ABOX}}><div style={ALAB}>AI CHAVRUSA</div>{aiL?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Thinking...</div>:<div style={{color:"#FAF3E8ee",fontSize:"14px",lineHeight:1.7}}>{ai}</div>}</div>}
    <div style={{position:"fixed",bottom:0,left:0,right:0,padding:`12px 20px calc(12px + ${SB})`,background:"#FAF3E8ee",borderTop:"1px solid #D4B89622",backdropFilter:"blur(12px)"}}>
      {!fb?<div style={{maxWidth:"400px",margin:"0 auto"}}><div style={{display:"flex",gap:"8px"}}><input ref={ref} type="text" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={onKey} placeholder={dir==="h2e"?"Type English...":"Type transliteration..."} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" style={{flex:1,padding:"14px 16px",borderRadius:"12px",border:"2px solid #D4B896",background:"#FFF",fontSize:"17px",color:"#3D2B1F"}}/><button onClick={sub} style={{padding:"14px 20px",borderRadius:"12px",background:inp.trim()?"linear-gradient(135deg,#C4956A,#A0764E)":"#D4B89633",color:"white",fontSize:"16px",minWidth:"72px",minHeight:"52px"}}>Go</button></div><button onClick={hint} disabled={aiL} style={{display:"block",margin:"10px auto 0",padding:"8px 16px",background:"none",color:"#B8A08077",fontSize:"13px",minHeight:"36px"}}>💡 Hint</button></div>
      :<div style={{maxWidth:"400px",margin:"0 auto"}}><div style={{background:fc[fb].bg,border:`2px solid ${fc[fb].bd}`,borderRadius:"12px",padding:"12px 16px",textAlign:"center",marginBottom:"8px"}}><div style={{fontSize:"16px",fontWeight:600,color:fc[fb].tx}}>{fc[fb].l}</div><div style={{fontSize:"14px",color:"#3D2B1F",marginTop:"4px"}}><span style={{fontFamily:"'Frank Ruhl Libre',serif",fontSize:"22px"}}>{cur.w.h}</span> = <strong>{cur.w.e}</strong></div>{fb==="wrong"&&<button onClick={mnem} disabled={aiL} style={{marginTop:"10px",...ABTN}}>🧠 Help me remember</button>}</div><button onClick={next} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"52px"}}>{idx+1<words.length?"Next →":"Complete ✓"}</button></div>}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// FILL-IN-THE-BLANK
// ═══════════════════════════════════════════════════
function FillBlank({blanks,progress,onAns,onDone,onSkip}){
  const[idx,setIdx]=useState(0),[inp,setInp]=useState(""),[fb,setFb]=useState(null);const ref=useRef(null);
  useEffect(()=>{if(ref.current&&!fb)setTimeout(()=>ref.current?.focus(),150);},[idx,fb]);
  const cur=blanks[idx];if(!cur)return null;
  const bw=blankWord(cur.ak);
  const sub=()=>{if(!inp.trim())return;const r=fuzzy(inp,bw.w.e);onAns(bw.t,bw.i,r!=="wrong");setFb(r);};
  const next=()=>{setInp("");setFb(null);if(idx+1>=blanks.length)onDone();else setIdx(idx+1);};
  const onKey=e=>{if(e.key==="Enter"){if(fb)next();else sub();}};
  const fc={exact:{bg:"#D4EDDA",bd:"#6B8E7B",tx:"#2D5F3F",l:"✓ Correct!"},close:{bg:"#FFF3CD",bd:"#C4956A",tx:"#6B5A2E",l:"~ Close"},wrong:{bg:"#F8D7DA",bd:"#D4726A",tx:"#7A2B2B",l:"✗ Not quite"}};
  return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px"}}><button onClick={onSkip} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>Skip</button><div style={{fontSize:"12px",color:"#8B7355"}}>📝 Fill the Blank · {idx+1}/{blanks.length}</div></div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px"}}>
      <div style={{...CARD}}>
        <div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",marginBottom:"12px"}}>FILL IN THE MISSING WORD</div>
        <div style={{fontSize:"28px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.4,direction:"rtl"}}>{cur.ph}</div>
        <div style={{fontSize:"14px",color:"#8B7355",marginTop:"10px",fontStyle:"italic"}}>{cur.hint}</div>
      </div>
    </div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,padding:`12px 20px calc(12px + ${SB})`,background:"#FAF3E8ee",borderTop:"1px solid #D4B89622",backdropFilter:"blur(12px)"}}>
      {!fb?<div style={{maxWidth:"400px",margin:"0 auto"}}><div style={{display:"flex",gap:"8px"}}><input ref={ref} type="text" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={onKey} placeholder="Type the missing word..." autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" style={{flex:1,padding:"14px 16px",borderRadius:"12px",border:"2px solid #D4B896",background:"#FFF",fontSize:"17px",color:"#3D2B1F"}}/><button onClick={sub} style={{padding:"14px 20px",borderRadius:"12px",background:inp.trim()?"linear-gradient(135deg,#C4956A,#A0764E)":"#D4B89633",color:"white",fontSize:"16px",minWidth:"72px",minHeight:"52px"}}>Go</button></div></div>
      :<div style={{maxWidth:"400px",margin:"0 auto"}}><div style={{background:fc[fb].bg,border:`2px solid ${fc[fb].bd}`,borderRadius:"12px",padding:"12px 16px",textAlign:"center",marginBottom:"8px"}}><div style={{fontSize:"16px",fontWeight:600,color:fc[fb].tx}}>{fc[fb].l}</div><div style={{fontSize:"14px",color:"#3D2B1F",marginTop:"4px"}}><span style={{fontFamily:"'Frank Ruhl Libre',serif",fontSize:"22px"}}>{bw.w.h}</span> ({bw.w.t}) = <strong>{bw.w.e}</strong></div></div><button onClick={next} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"52px"}}>{idx+1<blanks.length?"Next →":"Done ✓"}</button></div>}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// BOSS ROUND
// ═══════════════════════════════════════════════════
function Boss({onDone}){
  const[li,setLi]=useState(0),[rev,setRev]=useState([]),[allR,setAllR]=useState(false);
  const line=LINES[li%LINES.length],total=Math.min(LINES.length,3);
  const reveal=i=>{if(rev.includes(i))return;const nr=[...rev,i];setRev(nr);if(nr.length===line.parts.length)setAllR(true);};
  const next=()=>{if(li+1>=total)onDone();else{setLi(li+1);setRev([]);setAllR(false);}};
  return(<div style={{flex:1,padding:"0 20px 40px"}}><div style={{textAlign:"center",marginBottom:"16px"}}><div style={{fontSize:"13px",color:"#8B7355"}}>Line {li+1}/{total}</div></div>
    <div style={{display:"flex",flexWrap:"wrap",gap:"8px",justifyContent:"center",direction:"rtl",maxWidth:"400px",margin:"0 auto"}}>{line.parts.map((p,i)=><div key={i} onClick={()=>reveal(i)} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 14px",borderRadius:"10px",background:rev.includes(i)?"linear-gradient(135deg,#FAF3E8,#F0E4D0)":"#E8DCC8",border:`2px solid ${rev.includes(i)?"#C4956A":"#D4B89644"}`,minWidth:"48px",minHeight:"48px",justifyContent:"center",transition:"all 0.2s"}}><span style={{fontSize:"22px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F"}}>{stripN(p.h)}</span>{rev.includes(i)&&<span style={{fontSize:"11px",color:"#6B8E7B",marginTop:"4px",fontWeight:600,textAlign:"center"}}>{p.e}</span>}</div>)}</div>
    {allR&&<div style={{margin:"20px auto",background:"#F0EBE0",borderRadius:"12px",padding:"16px",textAlign:"center",border:"1px solid #D4B896",maxWidth:"400px",animation:"slideUp 0.3s ease"}}><div style={{fontSize:"12px",color:"#8B7355",marginBottom:"6px"}}>Full translation:</div><div style={{fontSize:"16px",color:"#3D2B1F",lineHeight:1.6}}>{line.full}</div><button onClick={next} style={{marginTop:"14px",padding:"14px 32px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"15px",minHeight:"48px"}}>{li+1<total?"Next Line →":"Done ✓"}</button></div>}
  </div>);
}

// ═══════════════════════════════════════════════════
// CONTEXT CHAIN (AI strings your words into a narrative)
// ═══════════════════════════════════════════════════
function ContextChain({words,onDone}){
  const[text,setText]=useState(""),[loading,setLoading]=useState(true),[revealed,setRevealed]=useState(false);
  useEffect(()=>{
    const wl=words.slice(0,8).map(w=>`${w.h} (${w.t}) = "${w.e}"`).join(", ");
    askAI(`Create a SHORT narrative (3-4 sentences) set in the context of Masechet Avodah Zarah, Perek HaSocher, that naturally uses ALL of these vocabulary words: ${wl}. Write it as a mini-story about a specific scenario in the sugya. Format: Write each sentence on a new line. Put the Hebrew words in brackets like [אָסוּר] when they appear. Use transliterations in parentheses. Make it feel like a real Gemara scenario, not a textbook example.`,
    "You are creating a contextual narrative for Gemara vocabulary review. Use every word provided. Keep it realistic to the masechet. 3-4 sentences max.",400)
    .then(t=>{setText(t);setLoading(false);});
  },[]);
  return(<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"20px",overflow:"auto"}}>
    <div style={{textAlign:"center",marginBottom:"16px"}}><div style={{fontSize:"20px",color:"#3D2B1F",fontWeight:600}}>🔗 Context Chain</div><div style={{fontSize:"13px",color:"#8B7355",marginTop:"4px"}}>Your words woven into a real sugya scenario</div></div>
    {loading?<div style={{...ABOX,maxWidth:"380px",width:"100%"}}><div style={ALAB}>AI CHAVRUSA</div><div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Weaving your words into a story...</div></div>
    :<div style={{maxWidth:"380px",width:"100%"}}>
      <div style={{...ABOX,marginBottom:"16px"}}><div style={ALAB}>YOUR WORDS IN CONTEXT</div><div style={{color:"#FAF3E8dd",fontSize:"16px",lineHeight:2,whiteSpace:"pre-wrap"}}>{text}</div></div>
      {!revealed?<button onClick={()=>setRevealed(true)} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"2px solid #C4956A",background:"transparent",color:"#C4956A",fontSize:"16px",minHeight:"52px",marginBottom:"10px"}}>Show word list</button>
      :<div style={{background:"rgba(107,142,123,0.08)",border:"1px solid rgba(107,142,123,0.15)",borderRadius:"12px",padding:"14px",marginBottom:"16px",animation:"slideUp 0.3s ease"}}><div style={{fontSize:"10px",color:"#6B8E7B",letterSpacing:"1.5px",marginBottom:"8px"}}>WORDS USED</div><div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>{words.slice(0,8).map((w,i)=><span key={i} style={{padding:"4px 10px",borderRadius:"6px",background:"rgba(107,142,123,0.1)",fontSize:"13px",color:"#3D2B1F"}}><span style={{fontFamily:"'Frank Ruhl Libre',serif"}}>{w.h}</span> = {w.e}</span>)}</div></div>}
      <button onClick={onDone} style={{width:"100%",padding:"16px",borderRadius:"14px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"17px",minHeight:"52px"}}>Done ✓</button>
    </div>}
  </div>);
}

// ═══════════════════════════════════════════════════
// MAKE A LAINING (advanced — full phrase translation)
// ═══════════════════════════════════════════════════
function Laining({pr,onBack}){
  const[li,setLi]=useState(0),[inp,setInp]=useState(""),[fb,setFb]=useState(null);
  const[ai,setAi]=useState(""),[aiL,setAiL]=useState(false);
  const line=LINES[li%LINES.length];const ref=useRef(null);
  useEffect(()=>{if(ref.current&&!fb)ref.current.focus();},[li,fb]);
  const sub=()=>{if(!inp.trim())return;setFb("done");
    setAiL(true);askAI(`Student tried to translate this Gemara phrase:\n"${line.parts.map(p=>p.h).join(" ")}"\nCorrect translation: "${line.full}"\nStudent wrote: "${inp}"\n\nRate their translation: what did they get right, what did they miss? Be encouraging. 2-3 sentences.`,
    "You are a Gemara rebbi evaluating a student's translation attempt. Be warm but honest.",300).then(t=>{setAi(t);setAiL(false);});
  };
  const next=()=>{setInp("");setFb(null);setAi("");setLi(li+1);};
  return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px"}}><button onClick={onBack} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>← Back</button><div style={{fontSize:"12px",color:"#8B7355"}}>📜 Laining · Line {(li%LINES.length)+1}</div></div>
    <div style={{textAlign:"center",padding:"0 20px 8px"}}><div style={{fontSize:"13px",color:"#8B7355"}}>Translate the full phrase</div></div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px",overflow:"auto"}}>
      <div style={{...CARD}}><div style={{fontSize:"28px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.5,direction:"rtl"}}>{line.parts.map(p=>stripN(p.h)).join(" ")}</div></div>
      {!fb?<div style={{width:"100%",maxWidth:"360px",marginTop:"16px"}}>
        <textarea ref={ref} value={inp} onChange={e=>setInp(e.target.value)} placeholder="Type the full translation..." rows={3} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"2px solid #D4B896",background:"#FFF",fontSize:"16px",color:"#3D2B1F",resize:"none",lineHeight:1.6}}/>
        <button onClick={sub} disabled={!inp.trim()} style={{marginTop:"10px",width:"100%",padding:"14px",borderRadius:"12px",background:inp.trim()?"linear-gradient(135deg,#C4956A,#A0764E)":"#D4B89633",color:"white",fontSize:"16px",minHeight:"52px"}}>Check Translation</button>
      </div>
      :<div style={{width:"100%",maxWidth:"360px",marginTop:"16px",animation:"slideUp 0.3s ease"}}>
        <div style={{background:"#D4EDDA",border:"2px solid #6B8E7B",borderRadius:"12px",padding:"14px",marginBottom:"10px"}}><div style={{fontSize:"12px",color:"#6B8E7B",marginBottom:"4px"}}>Correct translation:</div><div style={{fontSize:"15px",color:"#2D5F3F",lineHeight:1.6}}>{line.full}</div></div>
        {(ai||aiL)&&<div style={{...ABOX,marginBottom:"10px"}}><div style={ALAB}>REBBI FEEDBACK</div>{aiL?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Evaluating...</div>:<div style={{color:"#FAF3E8ee",fontSize:"14px",lineHeight:1.7}}>{ai}</div>}</div>}
        <button onClick={next} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"52px"}}>Next Line →</button>
      </div>}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// SESSION DEBRIEF (AI end-of-session summary)
// ═══════════════════════════════════════════════════
function SessionDebrief({sr,progress}){
  const[text,setText]=useState(""),[ld,setLd]=useState(false),[open,setOpen]=useState(false);
  const go=()=>{if(text)return setOpen(!open);setOpen(true);setLd(true);
    const weak=getWeakWords(progress).slice(0,8),t=tots(progress);
    askAI(`Session just ended. Results: ${sr.nw} new words learned, ${sr.lv} words leveled up. Overall: ${t.s}/${t.t} seen, ${t.m} mastered. Current weak spots: ${weak.map(w=>`${w.transliteration}=${w.english}(lv${w.level})`).join(", ")}. Give a 2-3 sentence debrief: what went well, what pattern to watch, one specific tip for next session.`,
    "You are a Gemara rebbi giving an end-of-session debrief. Warm, concise, actionable.",250).then(t=>{setText(t);setLd(false);});
  };
  return(<div style={{width:"100%",maxWidth:"300px",marginTop:"16px"}}>
    <button onClick={go} style={{width:"100%",padding:"10px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.15)",background:"transparent",color:"#C4956A66",fontSize:"13px",minHeight:"40px"}}>📋 Session Debrief</button>
    {open&&<div style={{marginTop:"10px",...ABOX}}><div style={ALAB}>SESSION DEBRIEF</div>{ld?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Reviewing your session...</div>:<div style={{color:"#FAF3E8dd",fontSize:"14px",lineHeight:1.7}}>{text}</div>}</div>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
