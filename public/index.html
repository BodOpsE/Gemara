function fuzzy(input,correct){const n=s=>s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");const a=n(input),b=n(correct);if(a===b)return"exact";for(const alt of b.split("/").map(s=>n(s.trim())))if(a===alt)return"exact";const skip=["the","a","an","to","of","is","it","in","for","he","she","one","who"];const ac=a.split(" ").filter(w=>!skip.includes(w)).join(" "),bc=b.split(" ").filter(w=>!skip.includes(w)).join(" ");if(ac&&ac===bc)return"close";const bw=bc.split(" "),aw=ac.split(" ");if(bw.length>0&&bw.every(w=>aw.includes(w)))return"close";if(aw.length>0&&aw.every(w=>bw.includes(w))&&aw.length>=bw.length*0.5)return"close";if(lev(a,b)<=2&&b.length>3)return"close";return"wrong";}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}

- Use transliterations in parentheses
- Warm tone, like a good chavrusa

async function askAI(prompt){
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],system:SYS})});
    const d=await r.json();return d.text||d.error||'No response';
  }catch(e){return'Could not connect.';}
}

function ws(p,t,i){return p.w?.[`${t}_${i}`]||{c:0,ic:0,sk:0,lv:0,ls:0};}
function upW(p,t,i,ok){const k=`${t}_${i}`,v=ws(p,t,i);return{...p,w:{...p.w,[k]:{c:v.c+(ok?1:0),ic:v.ic+(ok?0:1),sk:ok?v.sk+1:0,lv:ok?Math.min(v.lv+1,7):Math.max(v.lv-1,0),ls:Date.now()}}};}
const TO=["gemara_structural","gemara_content","rashi","tosfos"];
function allSeen(p){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0)a.push({w,i,t,s});});});return a.sort(()=>Math.random()-0.5);}
function nextWords(p,n){
  const weak=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0&&s.lv<=1)weak.push({w,i,t,s});});});
  weak.sort(()=>Math.random()-0.5);const wp=weak.slice(0,Math.min(2,Math.floor(n*0.4)));
  const rem=n-wp.length,fresh=[];
  for(const t of TO){if(fresh.length>=rem)break;(V[t]||[]).forEach((w,i)=>{if(fresh.length>=rem)return;const s=ws(p,t,i);if(s.ls===0)fresh.push({w,i,t,s});});}
  return[...wp,...fresh];
}
function nextTrack(p){for(const t of TO){if((V[t]||[]).some((_,i)=>ws(p,t,i).ls===0))return TRACKS[t].name;}return"All";}
function todayWords(p){const a=[],ct=new Date();ct.setHours(0,0,0,0);const c=ct.getTime();TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>=c)a.push({w,i,t,s});});});return a.sort(()=>Math.random()-0.5);}
function penaltyWords(p,n){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.lv>=3)a.push({w,i,t,s});});});return a.sort((a,b)=>b.s.lv-a.s.lv).slice(0,n);}
function totals(p){let m=0,s=0,t=0;TO.forEach(tid=>{(V[tid]||[]).forEach((_,i)=>{t++;const sc=ws(p,tid,i);if(sc.ls>0)s++;if(sc.lv>=4)m++;});});return{m,s,t};}
function calcPen(c){const today=todayKey(),last=c.ld;if(!last)return null;const m=daysBetween(last,today)-1;if(m<=0)return null;if(m>=7)return{missed:m,review:25,decay:true};if(m>=2)return{missed:m,review:20,decay:false};return{missed:1,review:10,decay:false};}

// STYLES
// ═══════════════════════════════════════════════════
const BG="linear-gradient(170deg,#1E1610 0%,#2C1E12 30%,#3D2B1F 100%)";
const LBG="linear-gradient(170deg,#FFF8EF 0%,#FAF3E8 50%,#F0E4D0 100%)";
const BTN={padding:"16px 24px",borderRadius:"14px",border:"none",fontSize:"17px",fontFamily:"'EB Garamond',serif",color:"white",fontWeight:500,minHeight:"52px",width:"100%"};
const CARD={width:"100%",maxWidth:"360px",margin:"0 auto",background:"linear-gradient(145deg,#FFFFFF,#FAF3E8)",borderRadius:"16px",border:"2px solid #D4B896",padding:"28px 20px",textAlign:"center"};
const safeBot="max(env(safe-area-inset-bottom, 0px), 16px)";

// ═══════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════
const IP={w:{}},IC={ld:null,sk:0,bsk:0,days:{},pc:true,md:null};

function App(){
  const[sc,setSc]=useState("load");
  const[pr,setPr]=useState(IP);
  const[cal,setCal]=useState(IC);
  const[pen,setPen]=useState(null);
  const[ss,setSs]=useState(null);
  const[sr,setSr]=useState({nw:0,lv:0});
  const[lw,setLw]=useState(null);
  const[sl,setSl]=useState("");

  useEffect(()=>{
    let p=S.get("gv4_p")||IP,c=S.get("gv4_c")||IC;
    const pe=calcPen(c);
    if(pe?.decay){const nw={...p.w};Object.keys(nw).forEach(k=>{if(nw[k].lv>4)nw[k]={...nw[k],lv:nw[k].lv-1};});p={...p,w:nw};}
    if(pe&&c.ld&&c.ld!==todayKey()){setPen(pe);c={...c,pc:false};}
    if(c.ld===todayKey()){setPen(null);c={...c,pc:true};}
    if(c.md&&c.md!==todayKey())c={...c,md:null};
    setPr(p);setCal(c);setSc("home");
  },[]);
  useEffect(()=>{if(sc!=="load"){S.set("gv4_p",pr);S.set("gv4_c",cal);}},[pr,cal]);

  const doAns=(t,i,ok)=>{
    const prev=ws(pr,t,i),np=upW(pr,t,i,ok),ns=ws(np,t,i);
    setPr(np);setSr(r=>({nw:r.nw+(prev.ls===0?1:0),lv:r.lv+(ns.lv>prev.lv?1:0)}));return np;
  };
  const rec=()=>{
    const today=todayKey(),el=Math.round((Date.now()-(ss||Date.now()))/1000);
    const prev=cal.days[today]||{ok:false,tm:0,nw:0,lv:0,ns:0};
    const isNew=!prev.ok;let sk=cal.sk;
    if(isNew){const y=new Date();y.setDate(y.getDate()-1);const yk=y.toISOString().slice(0,10);sk=(cal.ld===yk||cal.sk===0)?cal.sk+1:1;}
    const nc={...cal,ld:today,sk,bsk:Math.max(cal.bsk,sk),pc:true,days:{...cal.days,[today]:{ok:true,tm:prev.tm+el,nw:prev.nw+sr.nw,lv:prev.lv+sr.lv,ns:(prev.ns||0)+1}}};
    setCal(nc);setPen(null);return nc;
  };
  const go=(hasPen)=>{
    setSs(Date.now());setSr({nw:0,lv:0});
    if(hasPen){setLw(penaltyWords(pr,pen?.review||10));setSl("pen");setSc("test");}
    else{const seen=allSeen(pr);if(seen.length>0&&cal.md!==todayKey()){setLw(seen);setSl("am");setSc("test");}else setSc("teach");}
  };

  // ─── LOADING ───
  if(sc==="load")return<div style={{minHeight:"100vh",background:"#2C1E12",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{fontSize:"36px",fontFamily:"'Frank Ruhl Libre',serif",color:"#C4956A"}}>דַּף הַיּוֹמִי</div><div style={{fontSize:"14px",color:"#8B7355",marginTop:"8px",animation:"pulse 1.5s infinite"}}>Loading...</div></div></div>;

  // ─── HOME ───
  if(sc==="home"){
    const tot=totals(pr),today=todayKey(),td=cal.days[today];
    const hasPen=pen&&pen.missed>0&&!cal.pc;
    const done=td&&td.tm>=300&&(td.nw>=2||td.lv>=3);
    const tw=todayWords(pr),seenN=allSeen(pr).length;
    const morningDone=cal.md===today;
    const pct=Math.round((tot.s/tot.t)*100);

    return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:`24px 20px calc(24px + ${safeBot})`,color:"#FAF3E8"}}>
      <div style={{fontSize:"56px",marginBottom:"8px",lineHeight:1}}>{done?"✓":hasPen?"⚠️":td?"⏳":"📖"}</div>
      <div style={{fontSize:"24px",fontWeight:600,textAlign:"center",marginBottom:"6px",color:done?"#6B8E7B":hasPen?"#D4726A":"#FAF3E8"}}>{done?"Done for today":hasPen?`${pen.missed} day${pen.missed>1?"s":""} missed`:td?"Keep going":"Time to learn"}</div>
      <div style={{fontSize:"14px",color:"#8B7355",textAlign:"center",lineHeight:1.6,marginBottom:"20px",minHeight:"22px"}}>
        {done&&td&&<>{td.nw} new · {td.lv} leveled · {Math.floor(td.tm/60)}m</>}
        {hasPen&&<>Review {pen.review} words to clear{pen.decay?" · words decayed":""}</>}
        {!done&&!hasPen&&td&&<>{Math.floor(td.tm/60)}m so far · {td.nw} new</>}
        {!done&&!hasPen&&!td&&(seenN>0&&!morningDone?<>Morning review: {seenN} words</>:<>5 min minimum</>)}
      </div>
      {cal.sk>0&&<div style={{fontSize:"15px",color:"#C4956A",marginBottom:"20px"}}>{cal.sk>=7?"🔥":cal.sk>=3?"⚡":"📅"} {cal.sk} day streak</div>}
      <div style={{width:"100%",maxWidth:"300px",marginBottom:"6px"}}><div style={{height:"5px",background:"rgba(255,255,255,0.08)",borderRadius:"3px",overflow:"hidden"}}><div style={{height:"100%",borderRadius:"3px",background:"linear-gradient(90deg,#6B8E7B,#C4956A)",width:`${pct}%`,transition:"width 0.5s"}}/></div></div>
      <div style={{fontSize:"12px",color:"#8B735566",marginBottom:"32px"}}>{tot.s} / {tot.t} words seen</div>
      <button onClick={()=>go(hasPen)} style={{...BTN,background:hasPen?"linear-gradient(135deg,#D4726A,#B85450)":done?"linear-gradient(135deg,#6B8E7B,#5A7D6A)":"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"340px",boxShadow:"0 4px 20px rgba(164,118,78,0.3)",animation:!done&&!td?"glow 2s infinite":"none"}}>{hasPen?"Clear Penalty":seenN>0&&!morningDone?"Morning Review":done?"Bonus Round":"Start Learning"}</button>
      {tw.length>0&&td?.ok&&!done&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setLw([...tw]);setSl("pm");setSc("test");}} style={{marginTop:"12px",padding:"14px",borderRadius:"12px",border:"1px solid rgba(196,149,106,0.15)",background:"transparent",maxWidth:"340px",width:"100%",fontSize:"15px",color:"#C4956A66",minHeight:"48px"}}>Review today's {tw.length} words</button>}
      <button onClick={()=>{if(confirm("Reset ALL progress?")){setPr(IP);setCal(IC);setPen(null);}}} style={{marginTop:"48px",background:"none",border:"none",color:"#8B735520",fontSize:"10px",minHeight:"30px"}}>Reset</button>
    </div>);
  }

  // ─── TEACH ───
  if(sc==="teach"){
    const nw=nextWords(pr,5),tn=nextTrack(pr);
    if(nw.length===0)return<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px"}}><div style={{fontSize:"48px",marginBottom:"12px"}}>🎉</div><div style={{fontSize:"22px",color:"#3D2B1F",fontWeight:600}}>All {totals(pr).t} words learned!</div><button onClick={()=>setSc("home")} style={{...BTN,marginTop:"24px",background:"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"280px"}}>Home</button></div>;
    return<Teach key={Date.now()} words={nw} trackName={tn} onDone={()=>{setLw([...nw]);setSl("pt");setSc("test");}} onExit={()=>{if(sr.nw>0||sr.lv>0)rec();setSc("home");}}/>;
  }

  // ─── TEST ───
  if(sc==="test"){
    if(!lw||lw.length===0){
      if(sl==="am"){setCal(c=>({...c,md:todayKey()}));setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else if(sl==="pen"){setCal(c=>({...c,pc:true}));setPen(null);setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else setSc("teach");return null;
    }
    const labels={am:{t:"🌅 Morning Review",s:`${lw.length} words — prove you know them`},pen:{t:"⚠️ Penalty",s:`${lw.length} words to clear`},pt:{t:"✍️ Test Yourself",s:`Type the ${lw.length} words you just learned`},pm:{t:"🌙 Evening Review",s:`${lw.length} words from today`}};
    const lb=labels[sl]||labels.pt;
    const onDone=()=>{
      if(sl==="am"){setCal(c=>({...c,md:todayKey()}));setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else if(sl==="pen"){setCal(c=>({...c,pc:true}));setPen(null);setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else if(sl==="pt"){setSc("boss");}
      else{rec();setSc("done");}
    };
    return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px",alignItems:"center"}}>
        <button onClick={()=>{if(sl==="am"){setCal(c=>({...c,md:todayKey()}));setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}else{if(sr.nw>0||sr.lv>0)rec();setSc("home");}}} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>{sl==="am"?"Skip →":"✕ Exit"}</button>
        <div style={{fontSize:"12px",color:"#8B7355"}}>{lb.t}</div>
      </div>
      <div style={{textAlign:"center",padding:"0 20px 12px"}}><div style={{fontSize:"14px",color:"#8B7355"}}>{lb.s}</div></div>
      <Test key={sl+ss} words={lw} progress={pr} onAns={doAns} onDone={onDone} onExit={()=>{if(sr.nw>0||sr.lv>0)rec();setSc("home");}} showNek={l=>sl==="pt"||l<4} rDir={sl!=="pt"}/>
    </div>);
  }

  // ─── BOSS ───
  if(sc==="boss")return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px"}}><button onClick={()=>{rec();setSc("done");}} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>Skip</button><div style={{fontSize:"12px",color:"#8B7355"}}>📜 Boss Round</div></div>
    <div style={{textAlign:"center",padding:"0 20px 16px"}}><div style={{fontSize:"20px",color:"#3D2B1F",fontWeight:600}}>📜 Real Gemara</div><div style={{fontSize:"13px",color:"#8B7355"}}>Tap each word to reveal</div></div>
    <Boss onDone={()=>{rec();setSc("done");}}/>
  </div>);

  // ─── DONE ───
  if(sc==="done"){
    const td=cal.days[todayKey()]||{},done=td.tm>=300&&(td.nw>=2||td.lv>=3),tw=todayWords(pr);
    return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px",color:"#FAF3E8"}}>
      <div style={{fontSize:"56px",marginBottom:"14px"}}>{done?"🔥":"💪"}</div>
      <div style={{fontSize:"26px",fontWeight:600}}>{done?"Daily Goal Complete!":"Session Done"}</div>
      <div style={{fontSize:"15px",color:"#8B7355",marginTop:"8px",textAlign:"center",lineHeight:1.6}}>{sr.nw>0&&<>{sr.nw} new word{sr.nw>1?"s":""}<br/></>}{sr.lv>0&&<>{sr.lv} level-up{sr.lv>1?"s":""}<br/></>}{cal.sk>1&&<>🔥 {cal.sk} day streak</>}</div>
      <div style={{display:"flex",flexDirection:"column",gap:"10px",marginTop:"28px",width:"100%",maxWidth:"300px"}}>
        <button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}} style={{...BTN,background:"linear-gradient(135deg,#C4956A,#A0764E)"}}>Learn More</button>
        {tw.length>0&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setLw([...tw]);setSl("pm");setSc("test");}} style={{...BTN,background:"transparent",border:"1px solid rgba(196,149,106,0.2)",color:"#C4956A"}}>🌙 Review Today</button>}
        <button onClick={()=>setSc("home")} style={{...BTN,background:"transparent",border:"1px solid rgba(255,255,255,0.08)",color:"#8B7355"}}>Home</button>
      </div>
    </div>);
  }
  return null;
}

// ═══════════════════════════════════════════════════
// TEACH ROUND
// ═══════════════════════════════════════════════════
function Teach({words:wp,trackName,onDone,onExit}){
  const wr=useRef(wp),words=wr.current;
  const[idx,setIdx]=useState(0),[flip,setFlip]=useState(false);
  const[ai,setAi]=useState(""),[aiL,setAiL]=useState(false);
  const cur=words[idx];if(!cur)return null;
  const next=()=>{setFlip(false);setAi("");if(idx+1>=words.length)onDone();else setIdx(idx+1);};
  const askUse=async()=>{setAiL(true);setAi("");const t=await askAI(`Show how "${cur.w.h}" (${cur.w.t}, "${cur.w.e}") appears in a real Gemara context. Give the phrase, transliteration, and meaning. 2 sentences max.`);setAi(t);setAiL(false);};

  return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px",alignItems:"center"}}><button onClick={onExit} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>✕ Exit</button><div style={{fontSize:"12px",color:"#8B7355"}}>📚 {idx+1}/{words.length}</div></div>
    <div style={{textAlign:"center",padding:"0 20px 8px"}}><div style={{fontSize:"13px",color:"#8B7355"}}>{trackName&&`${trackName} · `}Study → then test</div></div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px",overflow:"auto"}}>
      <div style={{display:"flex",gap:"4px",justifyContent:"center",flexWrap:"wrap",maxWidth:"280px",marginBottom:"16px"}}>{words.map((_,i)=><div key={i} style={{width:"8px",height:"8px",borderRadius:"50%",background:i<idx?"#6B8E7B":i===idx?"#C4956A":"#D4B89644"}}/>)}</div>
      <div key={idx} style={{...CARD,animation:"fadeUp 0.3s ease"}}>
        <div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"10px"}}>{cur.w.c}</div>
        <div style={{fontSize:"48px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.2}}>{cur.w.h}</div>
        <div style={{fontSize:"16px",color:"#8B7355",marginTop:"8px",fontStyle:"italic"}}>{cur.w.t}</div>
        {!flip?<button onClick={()=>setFlip(true)} style={{marginTop:"24px",padding:"14px 36px",borderRadius:"12px",border:"2px solid #C4956A",background:"transparent",color:"#C4956A",fontSize:"17px",minHeight:"52px"}}>Show Meaning</button>
        :<div style={{marginTop:"16px",animation:"fadeUp 0.25s ease"}}>
          <div style={{width:"50%",height:"1px",background:"#D4B89633",margin:"0 auto 14px"}}/>
          <div style={{fontSize:"26px",color:"#3D2B1F",fontWeight:600}}>{cur.w.e}</div>
          <div style={{fontSize:"14px",color:"#8B7355",marginTop:"10px"}}>No nekudot: <span style={{fontFamily:"'Frank Ruhl Libre',serif",fontSize:"22px",color:"#3D2B1F"}}>{stripN(cur.w.h)}</span></div>
          {/* AI Tutor suggestion */}
          <button onClick={askUse} disabled={aiL} style={{marginTop:"16px",padding:"10px 20px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.25)",background:"rgba(44,30,18,0.04)",color:"#A0764E",fontSize:"13px",minHeight:"44px"}}>📖 Show me this in a real Gemara</button>
          {(ai||aiL)&&<div style={{marginTop:"12px",background:"linear-gradient(135deg,#2C1E12,#3D2B1F)",borderRadius:"12px",padding:"14px 16px",textAlign:"left",animation:"slideUp 0.3s ease"}}><div style={{fontSize:"9px",color:"#C4956A",letterSpacing:"1.5px",marginBottom:"6px"}}>AI CHAVRUSA</div>{aiL?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Thinking...</div>:<div style={{color:"#FAF3E8ee",fontSize:"14px",lineHeight:1.7}}>{ai}</div>}</div>}
          <button onClick={next} style={{marginTop:"20px",padding:"16px 40px",borderRadius:"14px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"17px",minHeight:"52px",width:"100%"}}>{idx+1<words.length?"Got It → Next":"Got It ✓"}</button>
        </div>}
      </div>
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// TEST ROUND
// ═══════════════════════════════════════════════════
function Test({words:wp,progress,onAns,onDone,onExit,showNek,rDir}){
  const wr=useRef(wp),words=wr.current;
  const[idx,setIdx]=useState(0),[inp,setInp]=useState(""),[fb,setFb]=useState(null),[dir,setDir]=useState("h2e");
  const[ai,setAi]=useState(""),[aiL,setAiL]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{if(rDir&&!fb)setDir(Math.random()>0.4?"h2e":"e2h");},[idx]);
  useEffect(()=>{if(ref.current&&!fb)setTimeout(()=>ref.current?.focus(),150);},[idx,fb]);
  const cur=words[idx];if(!cur)return null;
  const sc=ws(progress,cur.t,cur.i),useN=showNek(sc.lv),heb=useN?cur.w.h:stripN(cur.w.h);
  const sub=()=>{if(!inp.trim())return;const ans=dir==="h2e"?cur.w.e:cur.w.t;const r=fuzzy(inp,ans);onAns(cur.t,cur.i,r!=="wrong");setFb(r);};
  const next=()=>{setInp("");setFb(null);setAi("");if(idx+1>=words.length)onDone();else setIdx(idx+1);};
  const onKey=e=>{if(e.key==="Enter"){if(fb)next();else sub();}};
  const hint=async()=>{setAiL(true);setAi("");const t=await askAI(`HINT for "${cur.w.h}" (${cur.w.t}). Answer is "${cur.w.e}" — do NOT reveal it. Give a contextual clue: where it appears in Gemara, what it sounds like, or what type of word it is. One sentence.`);setAi(t);setAiL(false);};
  const mnem=async()=>{setAiL(true);setAi("");const t=await askAI(`Memory trick for "${cur.w.h}" (${cur.w.t}) = "${cur.w.e}". Be creative: wordplay, sounds-like, imagery, humor. 1-2 sentences.`);setAi(t);setAiL(false);};
  const fc={exact:{bg:"#D4EDDA",bd:"#6B8E7B",tx:"#2D5F3F",l:"✓ Correct!"},close:{bg:"#FFF3CD",bd:"#C4956A",tx:"#6B5A2E",l:"~ Close enough"},wrong:{bg:"#F8D7DA",bd:"#D4726A",tx:"#7A2B2B",l:"✗ Not quite"}};

  return(<div style={{display:"flex",flexDirection:"column",flex:1,padding:"0 20px"}}>
    <div style={{display:"flex",gap:"4px",justifyContent:"center",flexWrap:"wrap",maxWidth:"280px",margin:"0 auto 12px"}}>{words.map((_,i)=><div key={i} style={{width:"8px",height:"8px",borderRadius:"50%",background:i<idx?"#6B8E7B":i===idx?"#C4956A":"#D4B89644"}}/>)}</div>
    {!useN&&<div style={{fontSize:"11px",color:"#C4956A",letterSpacing:"1.5px",textTransform:"uppercase",textAlign:"center",marginBottom:"8px"}}>⚡ NO NEKUDOT</div>}
    <div style={{...CARD}}>
      {dir==="h2e"?<><div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"6px"}}>{cur.w.c} · {idx+1}/{words.length}</div><div style={{fontSize:"44px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.2}}>{heb}</div>{useN&&<div style={{fontSize:"14px",color:"#8B7355",marginTop:"6px",fontStyle:"italic"}}>{cur.w.t}</div>}</>
      :<><div style={{fontSize:"10px",color:"#B8A080",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"6px"}}>TRANSLITERATION · {idx+1}/{words.length}</div><div style={{fontSize:"24px",color:"#3D2B1F"}}>{cur.w.e}</div></>}
    </div>
    {/* AI response inline */}
    {(ai||aiL)&&<div style={{maxWidth:"360px",margin:"12px auto",background:"linear-gradient(135deg,#2C1E12,#3D2B1F)",borderRadius:"12px",padding:"14px 16px",textAlign:"left",animation:"slideUp 0.3s ease"}}><div style={{fontSize:"9px",color:"#C4956A",letterSpacing:"1.5px",marginBottom:"6px"}}>AI CHAVRUSA</div>{aiL?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Thinking...</div>:<div style={{color:"#FAF3E8ee",fontSize:"14px",lineHeight:1.7}}>{ai}</div>}</div>}
    {/* Bottom bar */}
    <div style={{position:"fixed",bottom:0,left:0,right:0,padding:`12px 20px calc(12px + ${safeBot})`,background:"#FAF3E8ee",borderTop:"1px solid #D4B89622",backdropFilter:"blur(12px)"}}>
      {!fb?<div style={{maxWidth:"400px",margin:"0 auto"}}>
        <div style={{display:"flex",gap:"8px"}}>
          <input ref={ref} type="text" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={onKey} placeholder={dir==="h2e"?"Type English...":"Type transliteration..."} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" style={{flex:1,padding:"14px 16px",borderRadius:"12px",border:"2px solid #D4B896",background:"#FFF",fontSize:"17px",color:"#3D2B1F"}}/>
          <button onClick={sub} style={{padding:"14px 20px",borderRadius:"12px",background:inp.trim()?"linear-gradient(135deg,#C4956A,#A0764E)":"#D4B89633",color:"white",fontSize:"16px",minWidth:"72px",minHeight:"52px"}}>Go</button>
        </div>
        <button onClick={hint} disabled={aiL} style={{display:"block",margin:"10px auto 0",padding:"8px 16px",background:"none",color:"#B8A08088",fontSize:"13px",minHeight:"36px"}}>💡 Hint me</button>
      </div>
      :<div style={{maxWidth:"400px",margin:"0 auto"}}>
        <div style={{background:fc[fb].bg,border:`2px solid ${fc[fb].bd}`,borderRadius:"12px",padding:"12px 16px",textAlign:"center",marginBottom:"8px"}}>
          <div style={{fontSize:"16px",fontWeight:600,color:fc[fb].tx}}>{fc[fb].l}</div>
          <div style={{fontSize:"14px",color:"#3D2B1F",marginTop:"4px"}}><span style={{fontFamily:"'Frank Ruhl Libre',serif",fontSize:"22px"}}>{cur.w.h}</span> = <strong>{cur.w.e}</strong></div>
          {fb==="wrong"&&<button onClick={mnem} disabled={aiL} style={{marginTop:"10px",padding:"8px 18px",borderRadius:"8px",border:"1px solid rgba(196,149,106,0.3)",background:"rgba(196,149,106,0.08)",color:"#A0764E",fontSize:"13px",minHeight:"40px"}}>🧠 Help me remember</button>}
        </div>
        <button onClick={next} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"52px"}}>{idx+1<words.length?"Next →":"Complete ✓"}</button>
      </div>}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// BOSS ROUND
// ═══════════════════════════════════════════════════
function Boss({onDone}){
  const[li,setLi]=useState(0),[rev,setRev]=useState([]),[allR,setAllR]=useState(false);
  const line=LINES[li%LINES.length],total=Math.min(LINES.length,3);
  const reveal=i=>{if(rev.includes(i))return;const nr=[...rev,i];setRev(nr);if(nr.length===line.parts.length)setAllR(true);};
  const next=()=>{if(li+1>=total)onDone();else{setLi(li+1);setRev([]);setAllR(false);}};
  return(<div style={{flex:1,padding:"0 20px 40px"}}>
    <div style={{textAlign:"center",marginBottom:"16px"}}><div style={{fontSize:"13px",color:"#8B7355"}}>Line {li+1}/{total}</div></div>
    <div style={{display:"flex",flexWrap:"wrap",gap:"8px",justifyContent:"center",direction:"rtl",maxWidth:"400px",margin:"0 auto"}}>
      {line.parts.map((p,i)=><div key={i} onClick={()=>reveal(i)} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"10px 14px",borderRadius:"10px",background:rev.includes(i)?"linear-gradient(135deg,#FAF3E8,#F0E4D0)":"#E8DCC8",border:`2px solid ${rev.includes(i)?"#C4956A":"#D4B89644"}`,minWidth:"48px",minHeight:"48px",justifyContent:"center",transition:"all 0.2s"}}><span style={{fontSize:"22px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F"}}>{stripN(p.h)}</span>{rev.includes(i)&&<span style={{fontSize:"11px",color:"#6B8E7B",marginTop:"4px",fontWeight:600,textAlign:"center"}}>{p.e}</span>}</div>)}
    </div>
    {allR&&<div style={{margin:"20px auto",background:"#F0EBE0",borderRadius:"12px",padding:"16px",textAlign:"center",border:"1px solid #D4B896",maxWidth:"400px",animation:"slideUp 0.3s ease"}}><div style={{fontSize:"12px",color:"#8B7355",marginBottom:"6px"}}>Full translation:</div><div style={{fontSize:"16px",color:"#3D2B1F",lineHeight:1.6}}>{line.full}</div><button onClick={next} style={{marginTop:"14px",padding:"14px 32px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"15px",minHeight:"48px"}}>{li+1<total?"Next Line →":"Done ✓"}</button></div>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
  </script>
