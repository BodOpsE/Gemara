// Improved fuzzy matching — accepts partial slash answers, lenient spelling
function fuzzy(a,b){
  const n=s=>s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ");
  const x=n(a),y=n(b);
  if(x===y)return"exact";
  // Split original on / before normalizing
  const alts=b.split("/").map(s=>n(s.trim())).filter(Boolean);
  for(const alt of alts)if(x===alt)return"exact";
  // Remove stop words for core comparison
  const sk=["the","a","an","to","of","is","it","in","for","he","she","one","who","its"];
  const xc=x.split(" ").filter(w=>!sk.includes(w)).join(" ");
  const yc=y.split(" ").filter(w=>!sk.includes(w)).join(" ");
  if(xc&&xc===yc)return"exact";
  // Check partial matches for each alt — if core words match, it's exact
  for(const alt of alts){
    const ac=alt.split(" ").filter(w=>!sk.includes(w)).join(" ");
    if(xc===ac)return"exact";
    if(ac.length>2&&lev(xc,ac)<=1)return"close";
  }
  // Check if all content words of input match all content words of answer (or vice versa)
  const yw=yc.split(" ").filter(Boolean),xw=xc.split(" ").filter(Boolean);
  if(yw.length>0&&yw.every(w=>xw.includes(w)))return"close";
  if(xw.length>0&&xw.every(w=>yw.includes(w))&&xw.length>=yw.length*0.4)return"close";
  // Generous levenshtein: allow 2 for short, 3 for longer
  if(y.length>3&&lev(x,y)<=(y.length>8?3:2))return"close";
  // Single word input matching first word of multi-word answer
  if(xw.length===1&&yw.length>1&&yw[0]===xw[0])return"close";
  return"wrong";
}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}

// Audio pronunciation (Web Speech API — Hebrew, best-effort for Aramaic)
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(stripN(text));
  u.lang='he-IL';u.rate=0.75;u.pitch=1.0;
  // Try to find a Hebrew voice
  const voices=window.speechSynthesis.getVoices();
  const hv=voices.find(v=>v.lang.startsWith('he'))||voices.find(v=>v.lang.startsWith('iw'));
  if(hv)u.voice=hv;
  window.speechSynthesis.speak(u);
}

async function askAI(prompt,sys,mt){try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}],system:sys||SYS,max_tokens:mt||500})});const d=await r.json();return d.text||d.error||'No response';}catch{return'Could not connect.';}}
async function askAICached(word,mode,prompt,sys,mt){
  const ck=aiCacheKey(word,mode);
  const cached=_AIC[ck]||LS.get("aic_"+ck);
  if(cached){_AIC[ck]=cached;return cached;}
  const r=await askAI(prompt,sys,mt);
  _AIC[ck]=r;LS.set("aic_"+ck,r);return r;
}

// ═══════════════════════════════════════════════════
// PROGRESS ENGINE (smarter selection, interleaved tracks)
// ═══════════════════════════════════════════════════
const TO=["gemara_structural","gemara_content","rashi","tosfos","rosh_hashanah"];
function ws(p,t,i){return p.w?.[`${t}_${i}`]||{c:0,ic:0,sk:0,lv:0,ls:0,rc:0,ft:0};}
function upW(p,t,i,ok){const k=`${t}_${i}`,v=ws(p,t,i);return{...p,w:{...p.w,[k]:{c:v.c+(ok?1:0),ic:v.ic+(ok?0:1),sk:ok?v.sk+1:0,lv:ok?Math.min(v.lv+1,7):Math.max(v.lv-1,0),ls:Date.now(),rc:(v.rc||0)+(ok?1:0),ft:v.ft||Date.now()}}};}
function allSeen(p){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0)a.push({w,i,t,s});});});return a;}
function isDue(s){if(!s.ls)return false;const hrs=[0,1,4,12,24,72,168,336];const elapsed=(Date.now()-s.ls)/36e5;return elapsed>=(hrs[s.lv]||0);}
function dueWords(p){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0&&isDue(s))a.push({w,i,t,s});});});return a.sort((a,b)=>a.s.ls-b.s.ls);}

// Smarter: interleave tracks, weight toward weakest
function nextWords(p,n){
  const due=dueWords(p).slice(0,Math.min(3,Math.floor(n*0.4)));
  const weak=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>0&&s.lv<=1&&!due.some(d=>d.t===t&&d.i===i))weak.push({w,i,t,s});});});
  weak.sort(()=>Math.random()-0.5);const wp=[...due,...weak.slice(0,Math.min(2,n-due.length))];
  const rem=n-wp.length;
  // Interleave fresh words across tracks
  const fresh=[];
  const freshByTrack=TO.map(t=>(V[t]||[]).map((w,i)=>({w,i,t,s:ws(p,t,i)})).filter(x=>x.s.ls===0));
  let ti=0;
  while(fresh.length<rem){
    let added=false;
    for(let j=0;j<TO.length;j++){
      const tIdx=(ti+j)%TO.length;
      if(freshByTrack[tIdx].length>0&&fresh.length<rem){fresh.push(freshByTrack[tIdx].shift());added=true;}
    }
    ti++;
    if(!added)break;
  }
  return[...wp,...fresh];
}
function nextTrack(p){for(const t of TO){if((V[t]||[]).some((_,i)=>ws(p,t,i).ls===0))return TRK[t].n;}return"All";}
function todayWords(p){const a=[],ct=new Date();ct.setHours(0,0,0,0);const c=ct.getTime();TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.ls>=c)a.push({w,i,t,s});});});return a.sort(()=>Math.random()-0.5);}
function penWords(p,n){const a=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(p,t,i);if(s.lv>=3)a.push({w,i,t,s});});});return a.sort((a,b)=>b.s.lv-a.s.lv).slice(0,n);}
function tots(p){let m=0,s=0,t=0;TO.forEach(tid=>{(V[tid]||[]).forEach((_,i)=>{t++;const sc=ws(p,tid,i);if(sc.ls>0)s++;if(sc.lv>=4)m++;});});return{m,s,t};}
function getWeakWords(p){const w=[];TO.forEach(t=>{(V[t]||[]).forEach((word,i)=>{const s=ws(p,t,i);if(s.ls>0&&(s.lv<=2||s.ic>s.c))w.push({hebrew:word.h,transliteration:word.t,english:word.e,cat:word.c,track:TRK[t].n,correct:s.c,incorrect:s.ic,level:s.lv});});});return w.sort((a,b)=>(a.level-b.level)||(b.incorrect-a.incorrect));}
function getWrongWords(p){const w=[];TO.forEach(t=>{(V[t]||[]).forEach((word,i)=>{const s=ws(p,t,i);if(s.ls>0&&(s.lv<=1||s.ic>=3))w.push({w:word,i,t,s});});});return w.sort((a,b)=>(a.s.lv-b.s.lv)||(b.s.ic-a.s.ic));}
function calcPen(c){const today=todayKey(),last=c.ld;if(!last)return null;const m=daysBetween(last,today)-1;
  // Don't count exempt days
  let actual=0;const d=new Date(last);for(let x=0;x<m;x++){d.setDate(d.getDate()+1);const dk=d.toISOString().slice(0,10);if(!isExempt(dk))actual++;}
  if(actual<=0)return null;const decay=actual>=7;const revPerDay=actual>=7?15:actual>=3?10:10;return{missed:actual,remaining:actual,review:revPerDay,decay};}
function trackStats(p){return TO.map(t=>{const ws_=V[t].map((_,i)=>ws(p,t,i));return{id:t,...TRK[t],seen:ws_.filter(s=>s.ls>0).length,total:V[t].length,mastered:ws_.filter(s=>s.lv>=4).length,totalRc:ws_.reduce((a,s)=>a+(s.rc||0),0)};});}
function catStats(p){const cats={};TO.forEach(t=>{V[t].forEach((w,i)=>{const s=ws(p,t,i);if(!cats[w.c])cats[w.c]={n:w.c,total:0,seen:0,mastered:0,wrong:0};cats[w.c].total++;if(s.ls>0)cats[w.c].seen++;if(s.lv>=4)cats[w.c].mastered++;cats[w.c].wrong+=s.ic;});});return Object.values(cats).sort((a,b)=>b.total-a.total);}
function getBlanksForWords(p){return BLANKS.filter(b=>{const pp=b.ak.split("_"),idx=parseInt(pp.pop()),tr=pp.join("_");return ws(p,tr,idx)?.ls>0;}).sort(()=>Math.random()-0.5);}
function blankWord(ak){const p=ak.split("_"),idx=parseInt(p.pop()),tr=p.join("_");return{w:V[tr]?.[idx],t:tr,i:idx};}

function SessionTimer({startTime}){
  const[el,setEl]=useState(0);
  useEffect(()=>{const iv=setInterval(()=>setEl(Math.round((Date.now()-startTime)/1000)),1000);return()=>clearInterval(iv);},[startTime]);

// CALENDAR STRIP (last 14 days, shows green/gray/red)
// ═══════════════════════════════════════════════════
function CalStrip({cal}){
  const days=[];const today=todayKey();
  for(let i=13;i>=0;i--){const d=new Date(estNow());d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);
    const done=cal.days[k]?.ok;const exempt=isExempt(k);const isToday=k===today;
    days.push({k,done,exempt,isToday,day:d.getDate(),dow:["S","M","T","W","T","F","S"][d.getDay()]});}
  return(<div style={{display:"flex",gap:"3px",justifyContent:"center",marginBottom:"16px"}}>
    {days.map(d=><div key={d.k} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
      <div style={{fontSize:"8px",color:"#8B735544"}}>{d.dow}</div>
      <div style={{width:"18px",height:"18px",borderRadius:"4px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:600,
        background:d.isToday?(d.done?"#6B8E7B":"rgba(196,149,106,0.3)"):d.done?"rgba(107,142,123,0.5)":d.exempt?"rgba(139,115,85,0.15)":"rgba(212,114,106,0.25)",
        color:d.isToday?"#FAF3E8":d.done?"#FAF3E8cc":d.exempt?"#8B735544":"#D4726A66",
        border:d.isToday?"1.5px solid #C4956A":"1px solid transparent"
      }}>{d.day}</div>
    </div>)}
  </div>);
}

    askAI(`Student stats: ${t.s}/${t.t} seen, ${t.m} mastered, ${cal.sk}-day streak, ${due} words due for review, ${weak.length} weak. Their weakest words are: ${weak.slice(0,5).map(w=>`${w.hebrew} (${w.transliteration}) = "${w.english}"`).join(", ")}. Give a 1-2 sentence personalized daily greeting and learning tip. ALWAYS include Hebrew with nekudot when mentioning any word, like תָּנָא (tana). Be warm, specific, actionable. Like a rebbi starting a morning seder.`,
    "You are a Gemara rebbi giving a personalized daily briefing. Max 2 sentences. Warm, specific. ALWAYS include Hebrew with nekudot next to transliterations.",200)
    .then(t=>{setText(t);LS.set("gv6_brief_"+todayKey(),t);setLoading(false);});}},[]);
  if(!text&&!loading)return null;

  },[]);

  const doAns=(t,i,ok)=>{const prev=ws(pr,t,i),np=upW(pr,t,i,ok),ns=ws(np,t,i);setPr(np);save(np,cal);setSr(r=>({nw:r.nw+(prev.ls===0?1:0),lv:r.lv+(ns.lv>prev.lv?1:0)}));return np;};
  const rec=(p2,c2)=>{const pp=p2||pr,cc=c2||cal;const today=todayKey(),el=Math.round((Date.now()-(ss||Date.now()))/1000);const prev=cc.days[today]||{ok:false,tm:0,nw:0,lv:0,ns:0};const isNew=!prev.ok;let sk=cc.sk;if(isNew){const y=new Date(estNow());y.setDate(y.getDate()-1);const yk=y.toISOString().slice(0,10);sk=(cc.ld===yk||cc.sk===0)?cc.sk+1:1;}const nc={...cc,ld:today,sk,bsk:Math.max(cc.bsk,sk),pc:true,days:{...cc.days,[today]:{ok:true,tm:prev.tm+el,nw:prev.nw+sr.nw,lv:prev.lv+sr.lv,ns:(prev.ns||0)+1}}};setCal(nc);setPen(null);save(pp,nc);syncToDb(pp,nc);return nc;};

  const go=(hasPen)=>{setSs(Date.now());setSr({nw:0,lv:0});if(hasPen){setLw(penWords(pr,pen?.review||10));setSl("pen");setSc("test");}else{
    // Morning review = DUE WORDS ONLY (not all seen)
    const dw=dueWords(pr);
    if(dw.length>0&&cal.md!==todayKey()){setLw(dw.slice(0,Math.min(20,dw.length)));setSl("am");setSc("test");}
    else setSc("teach");
  }};

  // Shabbos/YT check
  const todayExempt=isExempt(todayKey());

  if(sc==="load")return<div style={{minHeight:"100vh",background:"#2C1E12",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{fontSize:"36px",fontFamily:"'Frank Ruhl Libre',serif",color:"#C4956A"}}>דַּף הַיּוֹמִי</div><div style={{fontSize:"14px",color:"#8B7355",marginTop:"8px",animation:"pulse 1.5s infinite"}}>Loading...</div></div></div>;

  // ─── HOME (cleaned up: status + button + nav) ───
  if(sc==="home"){
    const tot=tots(pr),today=todayKey(),td=cal.days[today];const hasPen=pen&&pen.remaining>0&&!cal.pc;
    const done=td&&td.tm>=300&&(td.nw>=2||td.lv>=3);
    const morningDone=cal.md===today;const pct=tot.t>0?Math.round((tot.s/tot.t)*100):0;
    const dueN=dueWords(pr).length;const totalRc=Object.values(pr.w||{}).reduce((a,v)=>a+(v.rc||0),0);
    const wrongN=getWrongWords(pr).length;

    return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",padding:`24px 20px calc(24px + ${SB})`,color:"#FAF3E8"}}>
      {/* Sync indicator */}
      {sbOn&&<div style={{position:"fixed",top:"8px",right:"12px",fontSize:"9px",color:"#8B735544",zIndex:50}}>synced</div>}

      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",width:"100%",maxWidth:"360px"}}>
        {/* Calendar strip */}
        <CalStrip cal={cal}/>

        {/* Shabbos/YT message */}
        {todayExempt&&<div style={{textAlign:"center",marginBottom:"20px",padding:"16px",borderRadius:"12px",border:"1px solid rgba(196,149,106,0.12)",background:"rgba(196,149,106,0.04)"}}>
          <div style={{fontSize:"24px",marginBottom:"6px"}}>🕯️</div>
          <div style={{fontSize:"18px",color:"#C4956A",fontWeight:600}}>{new Date(today+"T12:00:00").getDay()===6?"Good Shabbos":"Good Yom Tov"}</div>
          <div style={{fontSize:"13px",color:"#8B7355",marginTop:"4px"}}>No learning required today</div>
        </div>}

        {/* Status */}
        <div style={{fontSize:"48px",marginBottom:"6px",lineHeight:1}}>{done?"✓":hasPen?"⚠️":todayExempt?"🕯️":td?"⏳":"📖"}</div>
        <div style={{fontSize:"22px",fontWeight:600,textAlign:"center",marginBottom:"4px",color:done?"#6B8E7B":hasPen?"#D4726A":"#FAF3E8"}}>{done?"Done for today":hasPen?`${pen.remaining} day${pen.remaining>1?"s":""} to clear (${pen.missed} missed)`:todayExempt?"Rest day":td?"Keep going":"Time to learn"}</div>
        <div style={{fontSize:"13px",color:"#8B7355",textAlign:"center",lineHeight:1.6,marginBottom:"8px"}}>
          {done&&td&&<>{td.nw} new · {td.lv} leveled · {Math.floor(td.tm/60)}m</>}
          {hasPen&&<>Day {pen.missed-pen.remaining+1} of {pen.missed}: review {pen.review} words{pen.decay?" · words decayed":""}</>}
          {!done&&!hasPen&&!todayExempt&&td&&<>{Math.floor(td.tm/60)}m so far · {td.nw} new</>}
          {!done&&!hasPen&&!todayExempt&&!td&&(dueN>0&&!morningDone?<>Morning review: {dueN} due</>:<>5 min minimum</>)}
        </div>

        {/* Compact stats line */}
        <div style={{fontSize:"11px",color:"#8B735566",marginBottom:"16px"}}>
          {cal.sk>0&&<span>{cal.sk>=7?"🔥":cal.sk>=3?"⚡":"📅"}{cal.sk} streak  </span>}
          <span>{tot.s}/{tot.t} words · {tot.m} mastered</span>
          {dueN>0&&<span style={{color:"#C4956A88"}}>  · ⏰{dueN} due</span>}
        </div>

        {/* Progress bar */}
        <div style={{width:"100%",maxWidth:"280px",marginBottom:"20px"}}><div style={{height:"4px",background:"rgba(255,255,255,0.08)",borderRadius:"3px",overflow:"hidden"}}><div style={{height:"100%",borderRadius:"3px",background:"linear-gradient(90deg,#6B8E7B,#C4956A)",width:`${pct}%`,transition:"width 0.5s"}}/></div></div>

        {/* Main button */}
        {!todayExempt&&<button onClick={()=>go(hasPen)} style={{...BTN,background:hasPen?"linear-gradient(135deg,#D4726A,#B85450)":done?"linear-gradient(135deg,#6B8E7B,#5A7D6A)":"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"320px",boxShadow:"0 4px 20px rgba(164,118,78,0.3)",animation:!done&&!td?"glow 2s infinite":"none"}}>{hasPen?`Clear Day ${pen.missed-pen.remaining+1}`:dueN>0&&!morningDone?"Morning Review":done?"Bonus Round":"Start Learning"}</button>}

        {/* Nav row */}
        <div style={{display:"flex",gap:"6px",marginTop:"16px",width:"100%",maxWidth:"320px"}}>
          <button onClick={()=>setSc("wordbank")} style={{flex:1,padding:"10px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.12)",background:"transparent",color:"#8B735566",fontSize:"12px",minHeight:"44px"}}>📋 Words</button>
          <button onClick={()=>setSc("progress")} style={{flex:1,padding:"10px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.12)",background:"transparent",color:"#8B735566",fontSize:"12px",minHeight:"44px"}}>📊 Progress</button>
          {wrongN>=3&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setLw(getWrongWords(pr).slice(0,15));setSl("drill");setSc("test");}} style={{flex:1,padding:"10px",borderRadius:"10px",border:"1px solid rgba(212,114,106,0.15)",background:"transparent",color:"#D4726A66",fontSize:"12px",minHeight:"44px"}}>🔨 Drill</button>}
          {getWeakWords(pr).length>=3&&<button onClick={()=>setSc("coach")} style={{flex:1,padding:"10px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.12)",background:"transparent",color:"#8B735566",fontSize:"12px",minHeight:"44px"}}>🎯 Coach</button>}
        </div>

        {/* Laining unlock */}
        {tot.m>=50&&<button onClick={()=>setSc("laining")} style={{marginTop:"10px",padding:"12px",borderRadius:"10px",border:"1px solid rgba(107,142,123,0.15)",background:"transparent",maxWidth:"320px",width:"100%",fontSize:"13px",color:"#6B8E7B66",minHeight:"44px"}}>📜 Make a Laining</button>}
      </div>
      <button onClick={()=>{if(confirm("Reset ALL progress?")){setPr(IP);setCal(IC);setPen(null);save(IP,IC);syncToDb(IP,IC);}}} style={{marginTop:"16px",background:"none",border:"none",color:"#8B735520",fontSize:"10px",minHeight:"30px"}}>Reset</button>
    </div>);
  }

  // ─── WORD BANK ───
  if(sc==="wordbank")return<WordBank pr={pr} onBack={()=>setSc("home")}/>;
  // ─── PROGRESS ───
  if(sc==="progress")return<ProgressView pr={pr} cal={cal} onBack={()=>setSc("home")}/>;
  // ─── AI COACH ───
  if(sc==="coach")return<CoachView pr={pr} cal={cal} onBack={()=>setSc("home")}/>;
  // ─── LAINING ───
  if(sc==="laining")return<Laining pr={pr} onBack={()=>setSc("home")}/>;

  // ─── TEACH (with build-faster: 5 then option for 8-10) ───
  if(sc==="teach"){
    const nw=nextWords(pr,5),tn=nextTrack(pr);
    if(nw.length===0)return<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px"}}><div style={{fontSize:"48px",marginBottom:"12px"}}>🎉</div><div style={{fontSize:"22px",color:"#3D2B1F",fontWeight:600}}>All {tots(pr).t} words learned!</div><button onClick={()=>setSc("home")} style={{...BTN,marginTop:"24px",background:"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"280px"}}>Home</button></div>;
    return<Teach key={Date.now()} words={nw} trackName={tn} progress={pr} onDone={()=>{setLw([...nw]);setSl("pt");setSc("test");}} onExit={()=>{if(sr.nw>0||sr.lv>0)rec();setSc("home");}} ss={ss}/>;
  }

  // ─── TEACH MORE (8-10 after first 5) ───
  if(sc==="teachmore"){
    const nw=nextWords(pr,8),tn=nextTrack(pr);
    if(nw.length===0){rec();setSc("done");return null;}
    return<Teach key={Date.now()} words={nw} trackName={tn} progress={pr} onDone={()=>{setLw([...nw]);setSl("pt2");setSc("test");}} onExit={()=>{if(sr.nw>0||sr.lv>0)rec();setSc("home");}} ss={ss}/>;
  }

  // ─── TEST ───
  if(sc==="test"){
    if(!lw||lw.length===0){
      if(sl==="am"){setCal(c=>({...c,md:todayKey()}));save(pr,{...cal,md:todayKey()});setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else if(sl==="pen"){const np={...pen,remaining:pen.remaining-1};if(np.remaining>0){setPen(np);setLw(penWords(pr,np.review));setSr({nw:0,lv:0});}else{const nc={...cal,pc:true};setCal(nc);save(pr,nc);setPen(null);setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}}
      else if(sl==="drill"){rec();setSc("done");}
      else setSc("fillblank");
      return null;
    }
    const labels={am:{t:"🌅 Morning Review",s:`${lw.length} due`},pen:{t:`⚠️ Penalty Day ${pen?(pen.missed-pen.remaining+1):1}/${pen?.missed||1}`,s:`${lw.length} to clear`},pt:{t:"✍️ Test",s:`${lw.length} words`},pt2:{t:"✍️ Test",s:`${lw.length} words`},pm:{t:"🌙 Review",s:`${lw.length} today`},drill:{t:"🔨 Wrong Drill",s:`${lw.length} words`}};const lb=labels[sl]||labels.pt;
    const onDone=()=>{
      if(sl==="am"){const nc={...cal,md:todayKey()};setCal(nc);save(pr,nc);setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}
      else if(sl==="pen"){const np={...pen,remaining:pen.remaining-1};if(np.remaining>0){setPen(np);setLw(penWords(pr,np.review));setSr({nw:0,lv:0});}else{const nc={...cal,pc:true};setCal(nc);save(pr,nc);setPen(null);setSs(Date.now());setSr({nw:0,lv:0});setSc("teach");}}
      else if(sl==="drill"){rec();setSc("done");}
      else if(sl==="pt"||sl==="pt2"){setSc("fillblank");}
      else{rec();setSc("done");}
    };
    return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px",alignItems:"center"}}><button onClick={()=>{if(sl==="am"){/* No skip — morning review is mandatory */}else{if(sr.nw>0||sr.lv>0)rec();setSc("home");}}} style={{background:"none",color:sl==="am"?"#8B735544":"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px",pointerEvents:sl==="am"?"none":"auto"}}>{sl==="am"?"🌅 Required":"✕"}</button><div style={{display:"flex",alignItems:"center",gap:"8px"}}>{ss&&<SessionTimer startTime={ss}/>}<span style={{fontSize:"12px",color:"#8B7355"}}>{lb.t}</span></div></div>
      <Test key={sl+ss} words={lw} progress={pr} onAns={doAns} onDone={onDone} showNek={l=>sl==="pt"||sl==="pt2"||l<4}/>
    </div>);
  }

  // ─── FILL-IN-THE-BLANK ───
  if(sc==="fillblank"){
    const avail=getBlanksForWords(pr).slice(0,4);
    if(avail.length===0){setSc("boss");return null;}
    return<FillBlank blanks={avail} progress={pr} onAns={doAns} onDone={()=>setSc("boss")} onSkip={()=>setSc("boss")} ss={ss}/>;
  }

  // ─── BOSS ───
  if(sc==="boss"){return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}><div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px"}}><button onClick={()=>{rec();setSc("done");}} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>Skip</button><div style={{display:"flex",alignItems:"center",gap:"8px"}}>{ss&&<SessionTimer startTime={ss}/>}<span style={{fontSize:"12px",color:"#8B7355"}}>📜 Boss Round</span></div></div><div style={{textAlign:"center",padding:"0 20px 16px"}}><div style={{fontSize:"20px",color:"#3D2B1F",fontWeight:600}}>Real Gemara</div><div style={{fontSize:"13px",color:"#8B7355"}}>Tap each word</div></div><Boss onDone={()=>setSc("wordreview")}/></div>);}

  // ─── WORD REVIEW (in-session) ───
  if(sc==="wordreview"){return<WordReview pr={pr} onDone={()=>{rec();setSc("done");}}/>;}


  // ─── DONE (with build-faster option) ───
  if(sc==="done"){
    const tot=tots(pr),today=todayKey(),td=cal.days[today];
    const hasMore=TO.some(t=>(V[t]||[]).some((_,i)=>ws(pr,t,i).ls===0));
    return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:`40px 20px calc(40px + ${SB})`,color:"#FAF3E8"}}>
      <div style={{fontSize:"56px",marginBottom:"12px"}}>✓</div>
      <div style={{fontSize:"24px",fontWeight:600,marginBottom:"6px",color:"#6B8E7B"}}>Session Complete</div>
      <div style={{fontSize:"14px",color:"#8B7355",marginBottom:"20px"}}>{sr.nw} new · {sr.lv} leveled{td?` · ${Math.floor(td.tm/60)}m total`:""}</div>
      <div style={{display:"flex",gap:"12px",marginBottom:"20px",fontSize:"13px",color:"#8B7355"}}>
        <span>{tot.s}/{tot.t} seen</span><span>{tot.m} mastered</span>{cal.sk>0&&<span>{cal.sk>=7?"🔥":cal.sk>=3?"⚡":"📅"} {cal.sk}</span>}
      </div>
      <SessionDebrief sr={sr} progress={pr}/>
      {/* Build faster */}
      {hasMore&&<button onClick={()=>{setSs(Date.now());setSr({nw:0,lv:0});setSc("teachmore");}} style={{...BTN,marginTop:"16px",background:"linear-gradient(135deg,#C4956A,#A0764E)",maxWidth:"300px"}}>⚡ Learn 8 More</button>}
      <button onClick={()=>setSc("home")} style={{...BTN,marginTop:"10px",background:"transparent",border:"1px solid rgba(196,149,106,0.2)",maxWidth:"300px",color:"#C4956A"}}>Home</button>
    </div>);
  }

  return null;
}

// ═══════════════════════════════════════════════════
// WORD BANK (Quick review + words in sentences)
// ═══════════════════════════════════════════════════
function WordBank({pr,onBack}){
  const[filter,setFilter]=useState("all");
  const[revealed,setRevealed]=useState({});
  const seen=[];TO.forEach(t=>{(V[t]||[]).forEach((w,i)=>{const s=ws(pr,t,i);if(s.ls>0)seen.push({w,t,i,s,k:t+"_"+i});});});
  const filtered=filter==="all"?seen:seen.filter(x=>x.t===filter);
  const toggle=k=>setRevealed(r=>({...r,[k]:!r[k]}));
  return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",padding:`20px 20px calc(20px + ${SB})`,color:"#FAF3E8"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"12px"}}><button onClick={onBack} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>← Back</button><div style={{fontSize:"14px",color:"#8B7355",lineHeight:"44px"}}>📋 Word Bank ({seen.length})</div></div>
    {/* Filter */}
    <div style={{display:"flex",gap:"4px",marginBottom:"16px",flexWrap:"wrap"}}><button onClick={()=>setFilter("all")} style={{padding:"6px 10px",borderRadius:"6px",fontSize:"11px",minHeight:"32px",background:filter==="all"?"rgba(196,149,106,0.2)":"transparent",color:filter==="all"?"#C4956A":"#8B735566",border:"1px solid rgba(196,149,106,0.15)"}}>All</button>
      {TO.map(t=><button key={t} onClick={()=>setFilter(t)} style={{padding:"6px 10px",borderRadius:"6px",fontSize:"11px",minHeight:"32px",background:filter===t?"rgba(196,149,106,0.2)":"transparent",color:filter===t?"#C4956A":"#8B735566",border:"1px solid rgba(196,149,106,0.15)"}}>{TRK[t].i} {TRK[t].n.split(":")[0]}</button>)}</div>
    {/* Word list */}
    <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
      {filtered.map(({w,t,i,s,k})=>{const isOpen=revealed[k];const lines=WORD_LINES[k]||[];
        return(<div key={k} onClick={()=>toggle(k)} style={{padding:"12px 14px",borderRadius:"10px",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.05)",cursor:"pointer"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:"10px"}}><span style={{fontSize:"22px",fontFamily:"'Frank Ruhl Libre',serif",color:"#FAF3E8"}}>{w.h}</span><span style={{fontSize:"12px",color:"#8B7355",fontStyle:"italic"}}>{w.t}</span></div>
            <div style={{display:"flex",alignItems:"center",gap:"6px"}}><span style={{fontSize:"9px",color:"#8B735544"}}>lv{s.lv}</span><span style={{fontSize:"12px",color:"#8B735566"}}>{isOpen?"▲":"▼"}</span></div>
          </div>
          {isOpen&&<div style={{marginTop:"10px",animation:"fadeUp 0.2s ease"}}>
            <div style={{fontSize:"16px",color:"#C4956A",marginBottom:"6px"}}>{w.e}</div>
            <div style={{fontSize:"12px",color:"#8B735588"}}>No nekudot: <span style={{fontFamily:"'Frank Ruhl Libre',serif",fontSize:"16px"}}>{stripN(w.h)}</span></div>
            {lines.length>0&&<div style={{marginTop:"8px",padding:"8px 10px",borderRadius:"6px",background:"rgba(196,149,106,0.06)",border:"1px solid rgba(196,149,106,0.1)"}}>
              <div style={{fontSize:"9px",color:"#C4956A",letterSpacing:"1.5px",marginBottom:"4px"}}>IN CONTEXT</div>
              {lines.slice(0,2).map((l,li)=><div key={li} style={{fontSize:"14px",fontFamily:"'Frank Ruhl Libre',serif",color:"#FAF3E8cc",direction:"rtl",marginBottom:"4px",lineHeight:1.5}}>{l.phrase}<div style={{fontSize:"11px",color:"#8B7355",direction:"ltr",fontFamily:"'EB Garamond',serif",fontStyle:"italic"}}>{l.trans}</div></div>)}
            </div>}
            <div style={{fontSize:"10px",color:"#8B735544",marginTop:"4px"}}>{s.c} correct · {s.ic} wrong · {s.rc||0} chazaros</div>
          </div>}
        </div>);
      })}
    </div>
    {filtered.length===0&&<div style={{textAlign:"center",color:"#8B735544",fontSize:"14px",marginTop:"40px"}}>No words learned yet</div>}
  </div>);
}

// ═══════════════════════════════════════════════════
// PROGRESS VIEW (with calendar grid)
// ═══════════════════════════════════════════════════
function ProgressView({pr,cal,onBack}){
  const ts=trackStats(pr),cs=catStats(pr),tot=tots(pr);const totalRc=Object.values(pr.w||{}).reduce((a,v)=>a+(v.rc||0),0);
  // Calendar grid: last 60 days
  const calDays=[];for(let i=59;i>=0;i--){const d=new Date(estNow());d.setDate(d.getDate()-i);calDays.push(d.toISOString().slice(0,10));}
  return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",padding:`20px 20px calc(20px + ${SB})`,color:"#FAF3E8"}}>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"20px"}}><button onClick={onBack} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>← Back</button><div style={{fontSize:"14px",color:"#8B7355",lineHeight:"44px"}}>📊 Progress</div></div>
    <div style={{textAlign:"center",marginBottom:"20px"}}>
      <div style={{fontSize:"48px",fontWeight:700,color:"#C4956A"}}>{tot.m}</div>
      <div style={{fontSize:"13px",color:"#8B7355"}}>words mastered of {tot.t}</div>
      <div style={{fontSize:"13px",color:"#8B735566",marginTop:"4px"}}>{totalRc} total chazaros · {cal.bsk||0} best streak</div>
    </div>
    {/* Calendar grid */}
    <div style={{fontSize:"11px",color:"#C4956A",letterSpacing:"1.5px",marginBottom:"8px"}}>60-DAY CALENDAR</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:"3px",marginBottom:"20px"}}>
      {calDays.map(dk=>{const done=cal.days[dk]?.ok;const exempt=isExempt(dk);
        return <div key={dk} title={dk} style={{width:"14px",height:"14px",borderRadius:"3px",background:done?"rgba(107,142,123,0.6)":exempt?"rgba(139,115,85,0.1)":"rgba(212,114,106,0.15)"}}/>;
      })}
    </div>

    <div style={{fontSize:"13px",color:"#8B7355",marginBottom:"16px"}}>Line {linesDone+1}/3</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:"8px",justifyContent:"center",maxWidth:"360px",marginBottom:"24px"}}>
      {line.parts.map((p,i)=><div key={i} onClick={()=>toggle(i)} style={{padding:"10px 14px",borderRadius:"10px",border:"2px solid "+(rev[i]?"#6B8E7B":"#D4B896"),background:rev[i]?"linear-gradient(145deg,#D4EDDA,#C4E8D0)":"linear-gradient(145deg,#FFFFFF,#FAF3E8)",cursor:"pointer",textAlign:"center",minWidth:"60px",transition:"all 0.2s"}}>
        <div style={{fontSize:"22px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F"}}>{stripN(p.h)}</div>
        {rev[i]&&<div style={{fontSize:"12px",color:"#6B8E7B",marginTop:"2px",animation:"fadeUp 0.2s ease"}}>{p.e}</div>}
      </div>)}
    </div>
    {allDone&&<div style={{width:"100%",maxWidth:"360px",animation:"slideUp 0.3s ease"}}>
      <div style={{background:"rgba(107,142,123,0.08)",border:"1px solid rgba(107,142,123,0.15)",borderRadius:"12px",padding:"14px",textAlign:"center",marginBottom:"16px"}}>
        <div style={{fontSize:"12px",color:"#6B8E7B",marginBottom:"4px"}}>Full translation:</div>
        <div style={{fontSize:"16px",color:"#3D2B1F",lineHeight:1.6}}>{line.full}</div>
      </div>
      <button onClick={()=>{if(linesDone>=2)onDone();else{setLinesDone(d=>d+1);nextLine();}}} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"48px"}}>{linesDone>=2?"Done ✓":"Next Line →"}</button>
    </div>}
  </div>);
}

// ═══════════════════════════════════════════════════
// LAINING (advanced translation)
// ═══════════════════════════════════════════════════
function Laining({pr,onBack}){
  const[li,setLi]=useState(0),[inp,setInp]=useState(""),[fb,setFb]=useState(null);
  const[ai,setAi]=useState(""),[aiL,setAiL]=useState(false);
  const line=LINES[li%LINES.length];const ref=useRef(null);
  useEffect(()=>{if(ref.current&&!fb)ref.current.focus();},[li,fb]);
  const sub=()=>{if(!inp.trim())return;setFb("done");
    setAiL(true);askAI(`Student tried to translate this Gemara phrase:\n"${line.parts.map(p=>p.h).join(" ")}"\nCorrect translation: "${line.full}"\nStudent wrote: "${inp}"\n\nRate their translation: what did they get right, what did they miss? Be encouraging. 2-3 sentences. Include Hebrew with nekudot.`,
    "You are a Gemara rebbi evaluating a student's translation attempt. Be warm but honest.",300).then(t=>{setAi(t);setAiL(false);});
  };
  const next=()=>{setInp("");setFb(null);setAi("");setLi(li+1);};
  return(<div style={{minHeight:"100vh",background:LBG,fontFamily:"'EB Garamond',serif",display:"flex",flexDirection:"column"}}>
    <div style={{display:"flex",justifyContent:"space-between",padding:"14px 20px"}}><button onClick={onBack} style={{background:"none",color:"#C4956A",fontSize:"14px",padding:"4px 8px",minHeight:"44px"}}>← Back</button><div style={{fontSize:"12px",color:"#8B7355"}}>📜 Laining · Line {(li%LINES.length)+1}</div></div>
    <div style={{textAlign:"center",padding:"0 20px 8px"}}><div style={{fontSize:"13px",color:"#8B7355"}}>Translate the full phrase</div></div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"0 20px",overflow:"auto"}}>
      <div style={{...CARD}}><div style={{fontSize:"26px",fontFamily:"'Frank Ruhl Libre',serif",color:"#3D2B1F",lineHeight:1.5,direction:"rtl"}}>{line.parts.map(p=>stripN(p.h)).join(" ")}</div></div>
      {!fb?<div style={{width:"100%",maxWidth:"360px",marginTop:"16px"}}>
        <textarea ref={ref} value={inp} onChange={e=>setInp(e.target.value)} placeholder="Type the full translation..." rows={3} style={{width:"100%",padding:"14px",borderRadius:"12px",border:"2px solid #D4B896",background:"#FFF",fontSize:"16px",color:"#3D2B1F",resize:"none",lineHeight:1.6}}/>
        <button onClick={sub} disabled={!inp.trim()} style={{marginTop:"10px",width:"100%",padding:"14px",borderRadius:"12px",background:inp.trim()?"linear-gradient(135deg,#C4956A,#A0764E)":"#D4B89633",color:"white",fontSize:"16px",minHeight:"52px"}}>Check Translation</button>
      </div>
      :<div style={{width:"100%",maxWidth:"360px",marginTop:"16px",animation:"slideUp 0.3s ease"}}>
        <div style={{background:"#D4EDDA",border:"2px solid #6B8E7B",borderRadius:"12px",padding:"14px",marginBottom:"10px"}}><div style={{fontSize:"12px",color:"#6B8E7B",marginBottom:"4px"}}>Correct translation:</div><div style={{fontSize:"15px",color:"#2D5F3F",lineHeight:1.6}}>{line.full}</div></div>
        {(ai||aiL)&&<div style={{...ABOX,marginBottom:"10px"}}><div style={ALAB}>REBBI FEEDBACK</div>{aiL?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Evaluating...</div>:<div style={{color:"#FAF3E8ee",fontSize:"14px",lineHeight:1.7}}>{ai}</div>}</div>}
        <button onClick={next} style={{width:"100%",padding:"14px",borderRadius:"12px",background:"linear-gradient(135deg,#C4956A,#A0764E)",color:"white",fontSize:"16px",minHeight:"52px"}}>Next Line →</button>
      </div>}
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// WORD REVIEW (in-session: quick review of today's words in context)
// ═══════════════════════════════════════════════════
function WordReview({pr,onDone}){
  const tw=todayWords(pr);
  const[revealed,setRevealed]=useState({});
  const toggle=k=>setRevealed(r=>({...r,[k]:!r[k]}));
  const allRev=Object.keys(revealed).length>=Math.min(tw.length,5);
  if(tw.length===0){onDone();return null;}
  return(<div style={{minHeight:"100vh",background:BG,fontFamily:"'EB Garamond',serif",padding:`20px 20px calc(20px + ${SB})`,color:"#FAF3E8"}}>
    <div style={{textAlign:"center",marginBottom:"16px"}}>
      <div style={{fontSize:"13px",color:"#C4956A",letterSpacing:"1.5px",marginBottom:"4px"}}>📋 QUICK REVIEW</div>
      <div style={{fontSize:"16px",color:"#FAF3E8cc"}}>Tap to reveal — scan your words in context</div>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:"8px",maxWidth:"400px",margin:"0 auto"}}>
      {tw.slice(0,12).map(({w,t,i,s})=>{const k=t+"_"+i;const isOpen=revealed[k];const lines=WORD_LINES[k]||[];
        return(<div key={k} onClick={()=>toggle(k)} style={{padding:"12px 14px",borderRadius:"10px",background:isOpen?"rgba(107,142,123,0.08)":"rgba(255,255,255,0.03)",border:`1px solid ${isOpen?"rgba(107,142,123,0.2)":"rgba(255,255,255,0.05)"}`,cursor:"pointer",minHeight:"52px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:"22px",fontFamily:"'Frank Ruhl Libre',serif"}}>{w.h}</span>
            <span style={{fontSize:"13px",color:isOpen?"#6B8E7B":"#8B735566",fontWeight:isOpen?600:400}}>{isOpen?w.e:"tap to reveal"}</span>
          </div>
          {isOpen&&<div style={{fontSize:"12px",color:"#C4956Acc",marginTop:"4px"}}>{w.t} = {w.e}</div>}
        </div>);
      })}
    </div>
    <div style={{textAlign:"center",marginTop:"20px"}}>
      <button onClick={onDone} style={{padding:"14px 40px",borderRadius:"14px",background:allRev?"linear-gradient(135deg,#C4956A,#A0764E)":"rgba(196,149,106,0.2)",color:"white",fontSize:"16px",fontFamily:"'EB Garamond',serif",minHeight:"52px",border:"none"}}>{allRev?"Continue →":`Tap at least ${Math.min(tw.length,5)} words`}</button>
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════
// SESSION DEBRIEF
// ═══════════════════════════════════════════════════
function SessionDebrief({sr,progress}){
  const[text,setText]=useState(""),[ld,setLd]=useState(false),[open,setOpen]=useState(false);
  const go=()=>{if(text)return setOpen(!open);setOpen(true);setLd(true);
    const weak=getWeakWords(progress).slice(0,8),t=tots(progress);
    askAI(`Session just ended. Results: ${sr.nw} new words learned, ${sr.lv} words leveled up. Overall: ${t.s}/${t.t} seen, ${t.m} mastered. Current weak spots: ${weak.map(w=>`${w.hebrew} ${w.transliteration}="${w.english}"(lv${w.level})`).join(", ")}. Give a 2-3 sentence debrief: what went well, what pattern to watch, one specific tip for next session. Include Hebrew with nekudot when mentioning any word.`,
    "You are a Gemara rebbi giving an end-of-session debrief. Warm, concise, actionable.",250).then(t=>{setText(t);setLd(false);});
  };
  return(<div style={{width:"100%",maxWidth:"300px",marginTop:"16px"}}>
    <button onClick={go} style={{width:"100%",padding:"10px",borderRadius:"10px",border:"1px solid rgba(196,149,106,0.15)",background:"transparent",color:"#C4956A66",fontSize:"13px",minHeight:"40px"}}>📋 Session Debrief</button>
    {open&&<div style={{marginTop:"10px",...ABOX}}><div style={ALAB}>SESSION DEBRIEF</div>{ld?<div style={{color:"#C4956A88",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Reviewing your session...</div>:<div style={{color:"#FAF3E8dd",fontSize:"14px",lineHeight:1.7}}>{text}</div>}</div>}
  </div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
